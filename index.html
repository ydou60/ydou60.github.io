    const board = leagueBoard(w, L.tier, 1, xp), rank = board.findIndex(r => r.me) + 1;
    let res = 'stay';
    if (rank <= 7 && L.tier < TIERS.length - 1) { L.tier++; res = 'up'; } else if (rank >= 16 && L.tier > 0) { L.tier--; res = 'down'; }
    L.last = { rank, res, tier: L.tier };

      if (res === 'up') { confetti(); openModal(`<div class="onb">${pip('happy', 120)}<h2>Promotion !</h2><p>Tu as fini ${rank}<sup>e</sup> la semaine dernière. Bienvenue en ligue <b>${TIERS[L.tier][0]}</b> ${TIERS[L.tier][1]}</p><button class="btn pri wide" data-act="closeModal">Génial</button></div>`); }

const SPEAKY = new Set(['speak', 'speak_word', 'shadow']);
const LISTENY = new Set(['listen_tiles', 'listen_type', 'minimal', 'listen_pick', 'dict']);
function fixType(t) {
  if (!canListen()) t = { listen_tiles: 'tr_en', listen_type: 'tr_en', listen_pick: 'what' }[t] || t;
  if (t === 'speak') { const m = speakMode(); t = m === 'mic' ? 'speak' : m === 'shadow' ? 'shadow' : canListen() ? 'listen_tiles' : 'tr_fr'; }
  return t;
}
function sentEx(s, t) { return { t: fixType(t), s }; }
function chunk(arr, k, parts) { const size = Math.ceil(arr.length / parts); return arr.slice(k * size, (k + 1) * size); }

function pairsEx(ws) {

  for (const w of shuffle(ws)) { if (seen.has(w.fr) || seen.has(w.en)) continue; seen.add(w.fr); seen.add(w.en); pick.push(w); if (pick.length === 5) break; }
  return pick.length >= 3 ? { t: 'pairs', ws: pick } : null;
}
function buildUnitLesson(u, l) {
  const U = UNITS[u], W = U.words, St = U.sents, ex = [], rest = [];
  if (l < 4) {
    const newW = chunk(W, l, 4), oldW = W.slice(0, Math.ceil(W.length / 4) * l);
    const newS = chunk(St, l, 4), oldS = St.slice(0, Math.ceil(St.length / 4) * l);
    const allW = newW.concat(oldW);
    newW.forEach(w => ex.push({ t: 'img', w, isNew: !S.words[w.en] }));
    rest.push(...wordExercises(allW, 2, ['what', 'listen_pick']));
    if (l > 0) rest.push({ t: 'type_tr', w: rand(allW) });
    const p = pairsEx(allW); if (p) rest.push(p);
    newS.forEach((s, k) => { rest.push(sentEx(s, k % 2 ? 'tr_fr' : 'tr_en')); rest.push(sentEx(s, rand(['listen_tiles', 'speak', 'fill', 'choose_tr']))); });
    shuffle(oldS).slice(0, 3).forEach(s => rest.push(sentEx(s, rand(['tr_en', 'listen_type', 'speak', 'tr_fr', 'fill']))));
    return ex.concat(shuffle(rest)).slice(0, 16);
  }
  if (l === 4) {
    const p = pairsEx(W); if (p) rest.push(p);
    rest.push(...wordExercises(W, 3, ['what', 'type_tr', 'listen_pick']));
    const types = ['tr_en', 'tr_fr', 'listen_tiles', 'speak', 'fill', 'choose_tr', 'listen_type', 'tr_en', 'speak'];
    shuffle(St).slice(0, 9).forEach((s, i) => rest.push(sentEx(s, types[i])));
    return shuffle(rest);
  }
  // l === 5 : évaluation
  rest.push(...wordExercises(W, 2, ['type_tr']));
  const types = ['tr_en', 'listen_type', 'speak', 'tr_en', 'listen_tiles', 'tr_fr', 'fill', 'speak', 'tr_en', 'listen_type', 'tr_fr', 'speak'];
  shuffle(St).forEach((s, i) => { if (i < types.length) rest.push(sentEx(s, types[i])); });

}
function unlockedUnits() { const cu = curUnit(); return UNITS.filter(U => U.u <= cu); }
function buildPractice(m) {

    ws = ws.slice(0, 8); if (!ws.length) return null;
    const ex = [];
    const p = pairsEx(ws); if (p) ex.push(p);
    ex.push(...wordExercises(ws, 4, ['what', 'type_tr', 'listen_pick', 'img']));
    const rel = shuffle(ALLS.filter(s => s.u <= curUnit() && wordsInSentence(s).some(en => ws.some(w => w.en === en)))).slice(0, 6);
    const types = ['tr_en', 'listen_type', 'speak', 'tr_fr', 'fill', 'listen_tiles'];
    rel.forEach((s, i) => ex.push(sentEx(s, types[i])));
    return shuffle(ex);
  }
  if (m === 'mistakes') {
    const ss = S.mistakes.map(id => SENT_BY_ID[id]).filter(Boolean).slice(-10); if (!ss.length) return null;
    return shuffle(ss.flatMap(s => [sentEx(s, rand(['tr_en', 'listen_tiles', 'fill'])), sentEx(s, rand(['tr_fr', 'speak', 'listen_type']))])).slice(0, 14);
  }

/* exercices à étiquettes (mode = 'fr' : FR→EN, 'en' : EN→FR, 'listen' : audio→EN) */
function tilesEx(ex, mode, title) {
  const s = ex.s, target = mode === 'en' ? s.fr : s.en, lang = mode === 'en' ? 'fr' : 'en';
  const answerToks = tileTokens(first(target), lang);
  const ansLow = new Set(answerToks.map(t => t.toLowerCase()));
  const sameLang = ALLS.filter(x => x.id !== s.id && Math.abs(x.u - s.u) <= 2).flatMap(x => tileTokens(first(mode === 'en' ? x.fr : x.en), lang).slice(1));
  const distract = uniq(shuffle(sameLang)).filter(t => !ansLow.has(t.toLowerCase())).slice(0, clamp(Math.round(answerToks.length * .6), 2, 5));
  const bank = shuffle(answerToks.concat(distract));
  let prompt;
  if (mode === 'fr') prompt = `<div class="speaker-row">${teacher(90, 'normal')}<div class="bubble">${esc(first(s.fr))}</div></div>`;
  else if (mode === 'en') prompt = `<div class="speaker-row">${teacher(90)}<div class="bubble">${spkButtons(first(s.en))}<span>${tappable(s.en, s.rd)}</span></div></div>`;
  else prompt = spkButtons(first(s.en), true);
  lessonShell(exHeader(title, ex) + prompt + `<div id="tilesArea"><div class="answer-line" id="ansLine"${lang === 'en' && COURSE.rtl ? ' dir="rtl"' : ''}></div><div class="bank" id="bank"${lang === 'en' && COURSE.rtl ? ' dir="rtl"' : ''}>${bank.map((t, i) => `<button class="tile" data-act="tile" data-i="${i}">${tileLabel(t, lang)}</button>`).join('')}</div></div>
    ${lang === 'en' ? `<button class="btn ghost sm kb-toggle" data-act="kbToggle">⌨️ Utiliser le clavier</button>` : ''}`, footAnswer(mode === 'listen' ? 'Je ne peux pas écouter' : 'Passer'));
  if (mode !== 'fr') autoplay(s.en);
  if (mode === 'listen') L.listen = true;
  L.bank = bank; L.picked = []; L.tileLang = lang; L.kb = false;
  L.check = () => {
    let r;
    if (L.kb) r = accepts($('#typed').value, target, lang, true, lang === 'en' ? s.rd : null);
    else r = accepts(L.picked.map(i => bank[i]).join(' '), target, lang, false);
    if (r.ok && lang === 'en') say(s.en);
    return { ...r, ans: lang === 'en' ? disp(first(target)) : first(target), sub: [lang === 'en' ? s.rd : null, mode === 'listen' ? first(s.fr) : null].filter(Boolean).join(' · ') || null };
  };
}
function renderTiles() {
  $('#ansLine').innerHTML = L.picked.map((bi, pos) => `<button class="tile" data-act="untile" data-p="${pos}">${tileLabel(L.bank[bi], L.tileLang)}</button>`).join('');
  $$('#bank .tile').forEach(b => b.classList.toggle('used', L.picked.includes(+b.dataset.i)));
  setReady(L.picked.length > 0);
}

const SUBJ_EX = new Set(['cours', 'sq', 'sn', 'dict']);

const subjEx = (U, i) => { const it = U.items[i]; return { t: it.dict ? 'dict' : it.o ? 'sq' : 'sn', it, u: U.u, sid: `${U.u}:${i}` }; };

  const U = UNITS[u], n = U.items[0].dict ? [3, 5, 5, 6][l] : [6, 8, 8, 10][l];
  const ex = shuffle(U.items.map((_, i) => i)).slice(0, n).map(i => subjEx(U, i));
  if (l === 0) ex.unshift({ t: 'cours', u });

}
function buildSubjectPractice(m) {
  if (m !== 'mistakes') { // révision espacée : d'abord les erreurs, puis des questions mélangées des chapitres déjà vus
    const errs = S.mistakes.filter(id => String(id).includes(':')).slice(-4).map(id => { const [u, i] = id.split(':').map(Number); return UNITS[u] && UNITS[u].items[i] ? subjEx(UNITS[u], i) : null; }).filter(Boolean);
    const us = UNITS.filter(U => S.done[`${U.u}-0`]); if (!us.length) return errs.length ? errs : null;
    const seen = new Set(errs.map(e => e.sid));
    return errs.concat(shuffle(us.flatMap(U => U.items.map((_, i) => subjEx(U, i)))).filter(e => !seen.has(e.sid)).slice(0, 10 - errs.length));
  }
  const ex = S.mistakes.filter(id => String(id).includes(':')).slice(-12).map(id => { const [u, i] = id.split(':').map(Number); return UNITS[u] && UNITS[u].items[i] ? subjEx(UNITS[u], i) : null; }).filter(Boolean);
    return ex.length ? shuffle(ex) : null;

/* ce qu'Amara lit : le cours, la question (version parlée), la dictée deux fois (normale puis lente) */
function narrateSubj(ex, still) {
  if (ex.t === 'cours') return speakSlide();
  if (ex.t === 'dict') { sayFr(DICT_INTRO, null, { when: still }); sayFr(ex.it.dict, null, { when: still }); sayFr(ex.it.dict, null, { when: still, slow: true }); return; }

const txtShow = x => Array.isArray(x) ? x[0] : x, txtSay = x => Array.isArray(x) ? x[1] : speakable(x);
/* la leçon d'Amara en 4 temps : l'idée, un exemple pas à pas, l'astuce, le piège */
const SLIDE_HEAD = [['💡', "L'idée", "L'idée."], ['👩🏾‍🏫', 'Je te montre, pas à pas', 'Je te montre, pas à pas.'], ['🧠', "L'astuce pour retenir", "L'astuce pour retenir."], ['⚠️', 'Attention au piège', 'Attention au piège !']];
function lessonOf(U) { return U.lesson || { idee: U.cours, exemple: null, astuce: U.cours, piege: null }; }
function slidesOf(U) { const ls = lessonOf(U); return [0, 1, 2, 3].filter(i => i === 0 || (i === 1 ? ls.exemple : i === 2 ? ls.astuce && ls.astuce !== ls.idee : ls.piege)); }
function speakSlide() {
  const ex = L.ex[L.i], U = UNITS[ex.u], ls = lessonOf(U), k = slidesOf(U)[L.slide], idx = L.i, sl = L.slide;
  const still = () => !!L && L.i === idx && L.slide === sl && L.phase === 'answer';
  stopSpeech();
  if (L.slide === 0) sayFr(`Le cours : ${U.title}.`, null, { when: still });
  sayFr(SLIDE_HEAD[k][2], null, { when: still });
  if (k === 0) sayFr(txtSay(ls.idee), null, { when: still });
  if (k === 2) sayFr(txtSay(ls.astuce), null, { when: still });
  if (k === 3) sayFr(txtSay(ls.piege), null, { when: still });
  if (k === 1) { // l'exemple apparaît ligne par ligne, au rythme de la voix d'Amara
    const show = n => { const el = $(`#step-${n}`); if (el && still()) el.classList.add('on'); };
    sayFr(txtSay(ls.exemple.titre), () => show(1), { when: still });
    ls.exemple.steps.forEach((st, n) => sayFr(txtSay(st), () => show(n + 2), { when: still }));
  }
}
const subjAnsText = it => it.dict ? it.dict : it.num != null ? nf(it.num) : it.o ? it.o[0] : it.ans[0];
/* « La bonne réponse est : … » — seulement quand la réponse se dit bien à voix haute */
function ansSpeech(it) {
  if (it.dict) return it.dict;
  const a = it.num != null ? sayNum(it.num) : subjAnsText(it);
  return /[²³⁴⁵×÷√=\/()^]|\d\s*x|x\s*[+−-]/.test(a) ? null : speakable(`La bonne réponse est : ${a}.`);

/* toutes les phrases que dit Amara dans les matières (pour les enregistrer avec sa voix) */
function subjectSpeechTexts() {
  const out = new Set([AMARA_HELLO, DICT_INTRO, MASTERY_SAY, END_TROPHY, ...END_OK, ...SLIDE_HEAD.map(h => h[2]), ...CHEERS_FR.ok, ...CHEERS_FR.ko, ...LEVELS.map(v => `Niveau ${v.name}.`)]);
  COURSE_LIST.filter(c => c.kind === 'subject').forEach(c => c.units.forEach(U => {
    out.add(`Le cours : ${U.title}.`); out.add(speakable(U.cours));
    const ls = U.lesson; if (ls) { [ls.idee, ls.astuce, ls.piege].filter(Boolean).forEach(x => out.add(txtSay(x))); if (ls.exemple) [ls.exemple.titre, ...ls.exemple.steps].forEach(x => out.add(txtSay(x))); }
    U.items.forEach(it => { if (it.dict) out.add(it.dict); else out.add(it.say || speakable(it.q)); const a = ansSpeech(it); if (a) out.add(a); if (it.ex) out.add(speakable(it.ex)); if (it.hint) out.add(speakable(it.hint)); });
  }));
  return [...out];
}

/* --- vérification des réponses --- */
const plainFr = t => String(t).toLowerCase().replace(/(\d+)\s*sur\s*(\d+)/g, '$1/$2').replace(/[’`]/g, "'").replace(/\s*\/\s*/g, '/').replace(/\s*'\s*/g, "'").replace(/[.!?;:«»"…,]/g, ' ').replace(/\s+/g, ' ').trim();
const noAcc = t => plainFr(t).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe').replace(/æ/g, 'ae');
function parseNum(v) { const m = String(v).replace(/\s/g, '').replace(/[−–]/g, '-').replace(',', '.').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }
function checkSubj(it, v) {
  if (it.num != null) { const x = parseNum(v); return { ok: x != null && Math.abs(x - it.num) <= (it.tol || 1e-9) }; }
  if (it.ans.some(a => plainFr(a) === plainFr(v))) return { ok: true };
  if (it.ans.some(a => noAcc(a) === noAcc(v))) return { ok: true, typo: true };
  return { ok: false };
}
/* dictée : on aligne les mots (comme un correcteur) et on souligne ceux qui sont faux ou oubliés */
function dictDiff(target, typed) {
  const words = t => String(t).replace(/[’`]/g, "'").split(/\s+/).map(w => w.replace(/^[«"(]+|[.,;:!?»")…]+$/g, '')).filter(Boolean);
  const T = words(target), U = words(typed), tl = T.map(w => w.toLowerCase()), ul = U.map(w => w.toLowerCase());
  const n = T.length, m = U.length, D = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) D[i][j] = tl[i] === ul[j] ? D[i + 1][j + 1] + 1 : Math.max(D[i + 1][j], D[i][j + 1]);
  const okT = new Array(n).fill(false); let i = 0, j = 0;
  while (i < n && j < m) { if (tl[i] === ul[j]) { okT[i] = true; i++; j++; } else if (D[i + 1][j] >= D[i][j + 1]) i++; else j++; }

const FR_NUMS = { zéro: 0, un: 1, une: 1, deux: 2, trois: 3, quatre: 4, cinq: 5, six: 6, sept: 7, huit: 8, neuf: 9, dix: 10, onze: 11, douze: 12, treize: 13, quatorze: 14, quinze: 15, seize: 16, vingt: 20, trente: 30, quarante: 40, cinquante: 50, soixante: 60, cent: 100, mille: 1000 };

  }

}

const PRAISE = ['Excellent !', 'Bravo !', 'Parfait !', 'Bien joué !', 'Super !', 'Génial !', 'Impeccable !'];

function grade(r, o = {}) {
  if (L.phase !== 'answer') return;

  const ex = L.ex[L.i]; L.total++;
  if (r.ok) {
    L.correct++; L.combo++; L.maxCombo = Math.max(L.maxCombo, L.combo); sfx.ok();
    if (L.listen) { S.stats.listens++; questProgress('listen'); }
    if ([5, 10, 15, 20].includes(L.combo)) comboBanner(L.combo);
    if (ex.retry && ex.s) S.mistakes = S.mistakes.filter(id => id !== ex.s.id);
    if (L.kind === 'practice' && ex.s) S.mistakes = S.mistakes.filter(id => id !== ex.s.id);
    if (ex.sid && (ex.retry || L.kind === 'practice')) S.mistakes = S.mistakes.filter(id => id !== ex.sid);
  } else {
    L.combo = 0; L.mistakes++; sfx.bad();
    if (L.jumpLives != null) L.jumpLives--;
    else if (!o.noHeart && !HEARTLESS.has(L.kind)) loseHeart();
    if (ex.s && !S.mistakes.includes(ex.s.id)) S.mistakes.push(ex.s.id);
    if (ex.sid && !S.mistakes.includes(ex.sid)) S.mistakes.push(ex.sid);
    if (L.kind !== 'jump' && !SPEAKY.has(ex.t) && (ex.retryN || 0) < 2) L.ex.push({ ...ex, retry: true, retryN: (ex.retryN || 0) + 1, isNew: false });
  }
  // répétition espacée
  if (ex.w) wordResult(ex.w.en, r.ok);
  if (ex.s) wordsInSentence(ex.s).forEach(en => wordResult(en, r.ok));
  if (r.words) r.words.forEach(([en, ok]) => { if (en !== (ex.w && ex.w.en)) wordResult(en, ok); });
  save();
  const foot = $('#lfoot');
  foot.className = 'l-foot ' + (r.ok ? 'good' : 'badf');

    const m = el.dataset.m;
    if (isSubj()) { const sx = buildSubjectPractice(m); if (!sx) { toast(m === 'mistakes' ? 'Aucune erreur à corriger 🎉' : 'Commence d\'abord un chapitre !'); return; } startLesson({ kind: 'practice', ex: sx }); return; }
    if (m === 'speak' && speakMode() === 'off') { toast('Active les exercices oraux dans Profil → Réglages.'); return; }
    const ex = buildPractice(m);
    if (!ex) { toast(m === 'mistakes' ? 'Aucune erreur à corriger 🎉' : 'Termine d\'abord une leçon !'); return; }
    startLesson({ kind: 'practice', ex });
  },
  streakInfo: () => openModal(`<div class="onb"><div style="font-size:80px" class="emoji">🔥</div><h2>Série de ${S.streak} jour${S.streak > 1 ? 's' : ''}</h2>
    <p class="muted">${S.lastDay === dayStr() ? 'Tu as déjà pratiqué aujourd\'hui. Reviens demain pour continuer !' : 'Termine une leçon aujourd\'hui pour prolonger ta série.'}</p>
    <p>🧊 Gels de série : <b>${S.freezes}</b>/2 · Record : <b>${S.bestStreak}</b></p></div>`),
  heartsInfo: () => openModal(`<div class="onb"><div style="font-size:70px" class="emoji">❤️</div><h2>${unlimited() ? 'Cœurs illimités' : `${S.hearts} / ${MAXH} cœurs`}</h2>
    <p class="muted">${unlimited() ? 'Mode illimité activé dans les réglages.' : S.hearts < MAXH ? `Prochain cœur dans ${nextHeartIn()}. Chaque erreur coûte un cœur ; la pratique t'en rend.` : 'Tes cœurs sont au maximum. Chaque erreur en leçon coûte un cœur.'}</p>
    ${!unlimited() && S.hearts < MAXH ? '<button class="btn pri wide" data-act="buyHearts">Recharger — 350 💎</button>' : ''}</div>`),
  claim: el => { const q = S.quests.list[+el.dataset.i]; if (!q || q.claimed || q.p < q.n) return; q.claimed = true; S.gems += q.gems; save(); sfx.win(); toast(`+${q.gems} 💎`); render(); },
  buyHearts: () => { if (S.hearts >= MAXH) return; if (buy(350)) { S.hearts = MAXH; save(); closeModal(); render(); toast('❤️ Cœurs rechargés !'); } },
  buyFreeze: () => { if (S.freezes >= 2) return; if (buy(200)) { S.freezes++; save(); render(); toast('🧊 Gel de série équipé'); } },
  buyDouble: () => { if (buy(100)) { S.doubleUntil = Date.now() + 15 * 60000; save(); render(); toast('⚡ Double XP activé pour 15 minutes !'); } },
  pipSkin: el => { const k = el.dataset.k; if (!S.owned[k]) { if (!buy(PIP_COLORS[k].price)) return; S.owned[k] = true; } S.pip = k; save(); render(); },
  toggle: el => { const k = el.dataset.k; S.settings[k] = !S.settings[k]; if (k === 'mic' && S.settings.mic) S.micOffUntil = 0; save(); render(); },
  'test-voice': () => isSubj() ? sayFr(AMARA_HELLO) : say(COURSE.code === 'en' ? 'Hello! My name is Pip. Let\'s learn English together!' : ALLS.length ? ALLS[0].en : UNITS[0].words[0].en),
  export: async () => {
    if (EMBED && window.claude && window.claude.use) {
      const dl = await window.claude.use('downloads');
      if (!dl) { toast('Export indisponible ici'); return; }
      try { await dl.save({ filename: `speakup-progression-${dayStr()}.json`, data: JSON.stringify(S, null, 1) }); toast('✅ Progression exportée'); } catch (e) { toast('Export annulé'); }
      return;
    }
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `speakup-progression-${dayStr()}.json`; a.click();
  },
  import: () => $('#import-file').click(),
  reset: () => openModal(`<div class="onb">${pip('sad', 110)}<h2>Tout effacer ?</h2><p class="muted">Ta progression, ta série et tes gemmes seront perdues définitivement.</p><button class="btn bad wide" data-act="resetYes">Oui, tout effacer</button></div>`),
  resetYes: () => { localStorage.removeItem(KEY); S = DEFAULT(); loadCourse('en'); save(); closeModal(); VIEW = 'learn'; render(); onboarding(); },
  onbGoal: el => { $$('[data-act=onbGoal]').forEach(b => b.classList.remove('sel')); el.classList.add('sel'); S.goal = +el.dataset.v; },
  onbAcc: el => { $$('[data-act=onbAcc]').forEach(b => b.classList.remove('sel')); el.classList.add('sel'); S.settings.accent = el.dataset.v; say('Hello!'); },
  onbCourse: el => { $$('[data-act=onbCourse]').forEach(b => b.classList.remove('sel')); el.classList.add('sel'); S.course = el.dataset.c; loadCourse(S.course); if (isSubj()) sayFr(AMARA_HELLO); else say(COURSE.code === 'en' ? 'Hello!' : UNITS[0].words[0].en); },
  courses: () => openModal(coursesHTML()),
  install: () => openModal(installHTML()),
  installNow: async () => { if (!INSTALL_PROMPT) return; INSTALL_PROMPT.prompt(); try { await INSTALL_PROMPT.userChoice; } catch (e) { } INSTALL_PROMPT = null; closeModal(); render(); },
  step: el => stepModal(el.dataset.k),
  hideInstall: () => { S.hideInstall = true; save(); render(); },
  pickCourse: el => switchCourse(el.dataset.c),
  onbDone: () => { S.name = ($('#onb-name').value || '').trim(); S.onboarded = true; save(); closeModal(); render(); },
  // leçon
  quitLesson: () => {
    if (L && L.i > 0) openModal(`<div class="onb">${pip('sad', 110)}<h2>Attends, ne pars pas !</h2><p class="muted">Si tu quittes maintenant, tu perdras ta progression dans cette leçon.</p>
      <div class="goal-opts"><button class="btn pri" data-act="closeModal">Continuer à apprendre</button><button class="btn ghost" data-act="exitLessonModal">Quitter</button></div></div>`);
    else exitLesson();
  },
  exitLessonModal: () => { closeModal(); exitLesson(); },
  exitLesson: () => exitLesson(),
  pick: el => pick(el),
  pair: el => pairClick(el),
  tile: el => { if (L.phase !== 'answer') return; const i = +el.dataset.i; if (L.picked.includes(i)) return; L.picked.push(i); sfx.tap(); if (L.tileLang === 'en') sayIdle(L.bank[i]); renderTiles(); },
  untile: el => { if (L.phase !== 'answer') return; L.picked.splice(+el.dataset.p, 1); renderTiles(); },
  kbToggle: el => {
    L.kb = !L.kb;
    if (L.kb) { $('#tilesArea').innerHTML = `<textarea class="typed" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" dir="auto" placeholder="Écris en ${esc(COURSE.adj)}"></textarea>`; const t = $('#typed'); t.focus(); t.addEventListener('input', () => setReady(!!t.value.trim())); el.textContent = '🧩 Utiliser les étiquettes'; setReady(false); }
    else { $('#tilesArea').innerHTML = `<div class="answer-line" id="ansLine"></div><div class="bank" id="bank"${COURSE.rtl ? ' dir="rtl"' : ''}>${L.bank.map((t, i) => `<button class="tile" data-act="tile" data-i="${i}">${tileLabel(t, L.tileLang)}</button>`).join('')}</div>`; L.picked = []; renderTiles(); el.textContent = '⌨️ Utiliser le clavier'; }
  },
  check: () => doCheck(),
  skip: () => {
    if (!L || L.phase !== 'answer') return;
    const ex = L.ex[L.i];
    if (L.listen && (LISTENY.has(ex.t) || ex.t === 'listen_pick')) return cantListen();
    if (ex.t === 'cours') return ACT.coursOk();
    if (ex.it) return grade({ ok: false, ans: subjAnsText(ex.it), sub: ex.it.ex });
    const ans = ex.s ? (ex.t === 'tr_fr' || ex.t === 'choose_tr' ? first(ex.s.fr) : disp(first(ex.s.en))) : ex.w ? `${ex.w.en} = ${ex.w.fr}` : ex.ans || ex.word || '';
    grade({ ok: false, ans }, { noHeart: SPEAKY.has(ex.t) });
  },
  continue: () => continueLesson(),
  mic: () => micClick(),
  cantSpeak: () => cantSpeak(),
  shadowYes: () => { if (!L || L.phase !== 'answer') return; S.stats.speaks++; questProgress('speak'); grade({ ok: true, ans: L.shadowText, sub: 'Continue à imiter les voix natives !' }); },
  shadowNo: () => { if (!L || L.phase !== 'answer') return; grade({ ok: false, ans: L.shadowText, sub: 'Réécoute avec 🐢 et répète lentement.' }, { noHeart: true }); },
  storyShadowOk: () => { if (!ST || ST.phase !== 'q') return; S.stats.speaks++; questProgress('speak'); storyAfterQ(true); },
  refillMid: () => { if (buy(350)) { S.hearts = MAXH; save(); L.i++; showEx(); } },
  // histoires
  toggleFr: el => el.classList.toggle('showfr'),
  storyNext: () => { if (!ST || ST.phase !== 'next') return; ST.i++; storyStep(); },
  storyPick: el => { if (ST.phase !== 'q') return; $$('[data-act=storyPick]').forEach(o => o.classList.remove('sel')); el.classList.add('sel'); ST.sel = +el.dataset.v; $('#checkBtn').disabled = false; },
  storyCheck: () => { if (ST.phase !== 'q' || ST.sel == null) return; storyAfterQ(ST.sel === ST.s.lines[ST.i].a); },
  storyMic: () => storyMic(),
  storySkipSpeak: () => { if (REC) { try { REC.abort(); } catch (e) { } REC = null; } storyAfterQ(false); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('.pop')) $$('.pop').forEach(p => p.remove()); return; }
  if (el.disabled) return;
  if (el.dataset.act !== 'node' && !el.closest('.pop')) $$('.pop').forEach(p => p.remove());
  const f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'import-file' && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { try { const d = JSON.parse(fr.result); if (!d || typeof d !== 'object' || !('xp' in d)) throw 0; localStorage.setItem(KEY, JSON.stringify(d)); S = load(); loadCourse(S.course || 'en'); render(); toast('✅ Progression importée'); } catch (err) { toast('❌ Fichier invalide'); } };
    fr.readAsText(el.files[0]); return;
  }
  if (el.id === 'set-name') { S.name = el.value.trim(); save(); render(); return; }
  const k = el.dataset.set; if (!k) return;
  if (k === 'aiPick') { S.settings.aiPick = { ...(S.settings.aiPick || {}), [COURSE.code]: el.value }; save(); ACT['test-voice'](); return; }
  if (k === 'voiceGender') { S.settings.voiceGender = el.value; S.settings.voices = {}; S.settings.aiPick = {}; save(); render(); ACT['test-voice'](); return; }
  if (k === 'voice') { S.settings.voices = { ...(S.settings.voices || {}), [COURSE.code]: el.value }; save(); ACT['test-voice'](); return; }
  if (k === 'goal') S.goal = +el.value; else if (k === 'rate') S.settings.rate = +el.value; else S.settings[k] = el.value;
  save(); render();
});
document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('on')) { if (e.key === 'Escape') closeModal(); return; }
  if (ST && $('#overlay').classList.contains('on')) {
    if (e.key === 'Enter') { e.preventDefault(); if (ST.phase === 'next') ACT.storyNext(); else if (ST.sel != null) ACT.storyCheck(); }
    else if (/^[1-9]$/.test(e.key) && ST.phase === 'q') { const o = $$('[data-act=storyPick]')[+e.key - 1]; if (o) ACT.storyPick(o); }
    return;
  }
  if (!L || !$('#overlay').classList.contains('on')) return;
  if (e.key === 'Enter') { e.preventDefault(); if (L.phase === 'feedback') continueLesson(); else doCheck(); return; }
  const typing = /input|textarea/i.test(document.activeElement.tagName);
  if (!typing && /^[1-9]$/.test(e.key) && L.phase === 'answer') { const o = $$('.l-body [data-opt]')[+e.key - 1]; if (o) pick(o); }
});
setInterval(() => { if (!L && !ST && !$('#modal').classList.contains('on') && VIEW !== 'profile') { const before = S.hearts; syncHearts(); if (S.hearts !== before) { save(); render(); } } }, 60000);

/* ---------- Démarrage ---------- */
loadCourse(S.course || 'en'); fitViewport();
checkStreak(); settleLeague(); ensureQuests(); render();
if (!S.onboarded) onboarding();
initCloud();
// Fonctionnement hors ligne + mises à jour automatiques (site publié uniquement)
if ('serviceWorker' in navigator && location.protocol === 'https:' && !EMBED) {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    reg.update().catch(() => { });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => { }); }); // vérifie à chaque retour dans l'appli
  }).catch(() => { });
  // une nouvelle version vient de s'installer : on recharge une fois (sauf en pleine leçon) pour l'afficher
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !L && !ST && !window.__reloaded) { window.__reloaded = true; location.reload(); } });
}
</script>
</body>
</html>
