<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeakUp — Langues et matières avec Amara</title>
<meta name="theme-color" content="#E7E1D9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SpeakUp">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F5F3FF; --card:#FFFFFF; --card2:#FAF9FF; --ink:#1E1B3A; --muted:#6B6890; --line:#E5E1F5;
  --pri:#6C4CF5; --pri-d:#4F31D6; --pri-l:#EDE8FF;
  --ok:#12B07A; --ok-d:#0B8A5E; --ok-bg:#DCF7EA;
  --bad:#EF4562; --bad-d:#C62944; --bad-bg:#FDE4E8;
  --gold:#FFB800; --gold-d:#D99A00; --coral:#FF7A59; --sky:#2EA8FF; --fire:#FF8A00;
  --shadow:0 8px 24px rgba(40,20,120,.08);
  --r:18px;
}
:root[data-theme="dark"]{
  --bg:#13111F; --card:#1E1B2E; --card2:#252238; --ink:#F1EFFF; --muted:#A39FC4; --line:#332F4D;
  --pri:#8B70FF; --pri-d:#6A4DEB; --pri-l:#2C2650; --ok-bg:#123A2D; --bad-bg:#431C26; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13111F; --card:#1E1B2E; --card2:#252238; --ink:#F1EFFF; --muted:#A39FC4; --line:#332F4D;
    --pri:#8B70FF; --pri-d:#6A4DEB; --pri-l:#2C2650; --ok-bg:#123A2D; --bad-bg:#431C26; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:25;background:var(--bg)}
input,textarea,select{font:inherit;color:var(--ink)}
h1,h2,h3{margin:0 0 .4em;font-weight:900;letter-spacing:-.01em}
p{margin:.3em 0}
.muted{color:var(--muted)}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:240px minmax(0,1fr) 340px;min-height:100vh;max-width:1400px;margin:0 auto}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:26px;color:var(--pri);padding:6px 10px 18px}
.logo svg{flex:none}
.nav-btn{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;font-weight:800;color:var(--muted);text-align:left;border:2px solid transparent;font-size:15px;text-transform:uppercase;letter-spacing:.03em}
.nav-btn .ni{font-size:24px;width:30px;text-align:center}
.nav-btn:hover{background:var(--card2)}
.nav-btn.on{background:var(--pri-l);color:var(--pri);border-color:var(--pri)}
#main{padding:0 24px 120px;min-width:0}
#rail{padding:20px 20px 40px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:16px}
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--bg);display:flex;justify-content:flex-end;gap:6px;padding:14px 0 10px}
.stat{display:flex;align-items:center;gap:6px;font-weight:900;padding:6px 10px;border-radius:12px;font-size:17px}
.stat:hover{background:var(--card2)}
.stat.fire{color:var(--fire)} .stat.gem{color:var(--sky)} .stat.heart{color:var(--bad)} .stat.flag{margin-right:auto}
.stat.dim{filter:grayscale(1);opacity:.6}

@media (max-width:1100px){ #app{grid-template-columns:88px minmax(0,1fr)} #rail{display:none} .nav-btn span.nl{display:none} .logo span{display:none} .nav-btn{justify-content:center} }
@media (max-width:700px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:2px solid var(--line);background:var(--card);z-index:30}
  .logo{display:none}
  .nav-btn{padding:8px 4px;border-radius:12px;flex:1;min-width:0}
  .nav-btn .ni{font-size:22px;width:auto}
  #main{padding:0 16px 110px}
}

/* ---------- Cards / buttons ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:16px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;font-size:15px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;transition:transform .06s, filter .15s}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--pri);border-color:var(--pri-d);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok-d);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad-d);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold-d);color:#3a2800}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost-w{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff;padding:9px 14px;font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:800;font-size:12px;background:var(--pri-l);color:var(--pri)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.page-title{display:flex;align-items:center;gap:14px;margin:8px 0 20px}
.page-title h1{font-size:28px;margin:0}
.section-h{font-size:20px;margin:28px 0 12px}

/* ---------- Path ---------- */
.unit{margin:10px auto 40px;max-width:600px}
.unit-head{background:var(--uc);color:#fff;border-radius:var(--r);padding:18px 20px;display:flex;gap:12px;justify-content:space-between;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.18);position:sticky;top:calc(64px + env(safe-area-inset-top, 0px));z-index:5}
.unit-head h2{font-size:22px;margin:2px 0}
.unit-head p{opacity:.9;font-weight:700;margin:0}
.unit-kicker{font-weight:900;opacity:.85;text-transform:uppercase;font-size:13px;letter-spacing:.06em}
.unit-btns{display:flex;flex-direction:column;gap:6px}
.unit.locked .unit-head{filter:saturate(.25) brightness(.9)}
.nodes{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:34px 0 10px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:76px;height:70px;border-radius:50%;background:var(--uc);color:#fff;font-size:30px;font-weight:900;box-shadow:0 8px 0 rgba(0,0,0,.22), inset 0 -6px 0 rgba(0,0,0,.08);transition:transform .1s;display:flex;align-items:center;justify-content:center}
.node:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.node.lock{background:var(--line);color:var(--muted);box-shadow:0 8px 0 rgba(0,0,0,.12)}
.node.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-d)}
.node.chest,.node.trophy{background:transparent;box-shadow:none;font-size:52px}
.node.chest.lock,.node.trophy.lock{filter:grayscale(1);opacity:.55}
.node.cur{outline:6px solid color-mix(in srgb,var(--uc) 30%,transparent);outline-offset:6px;animation:pulse 1.8s infinite}
.node.chest.cur,.node.trophy.cur{outline:none;animation:wiggle 1.6s infinite}
@keyframes pulse{50%{outline-offset:10px}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
.start-tag{position:absolute;top:-46px;background:var(--card);border:2px solid var(--line);color:var(--uc);font-weight:900;text-transform:uppercase;padding:7px 12px;border-radius:12px;white-space:nowrap;font-size:14px;animation:bob 1.4s ease-in-out infinite;z-index:2}
.start-tag:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line);border-bottom:0}
@keyframes bob{50%{transform:translateY(-5px)}}
.deco{position:absolute;top:110px;font-size:80px;pointer-events:none;opacity:.95}
.deco.left{left:6%} .deco.right{right:6%}
@media(max-width:560px){.deco{display:none}}
.pop{position:absolute;left:50%;transform:translateX(-50%);width:min(290px,calc(100vw - 40px));background:var(--uc);color:#fff;border-radius:16px;padding:16px;z-index:10;box-shadow:var(--shadow);animation:fadein .15s ease-out}
@keyframes fadein{from{opacity:0}}
.pop:before{content:"";position:absolute;top:-9px;left:var(--ax,50%);margin-left:-9px;border:9px solid transparent;border-bottom-color:var(--uc);border-top:0}
.pop.lockp{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.pop.lockp:before{border-bottom-color:var(--line)}
.pop h3{font-size:18px;margin-bottom:4px}
.pop .btn{width:100%;margin-top:12px;background:#fff;color:var(--uc);border-color:rgba(0,0,0,.15)}
@keyframes popin{from{transform:scale(.9);opacity:0}}

/* ---------- Rail widgets ---------- */
.goal-ring{display:flex;align-items:center;gap:14px}
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.bar.pri>i{background:var(--pri)} .bar.ok>i{background:var(--ok)}
.q-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.q-row+.q-row{border-top:2px solid var(--line)}
.q-ico{font-size:30px;width:40px;text-align:center}
.q-main{flex:1;min-width:0}
.q-main b{display:block;margin-bottom:6px}

/* ---------- Overlay (lesson / story) ---------- */
#overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column}
#overlay.on{display:flex}
.l-top{display:flex;align-items:center;gap:16px;padding:calc(20px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 20px max(24px, env(safe-area-inset-left, 0px));max-width:1000px;width:100%;margin:0 auto}
.l-top .bar{flex:1;height:18px}
.l-top .bar>i{background:var(--ok);box-shadow:inset 0 -5px 0 rgba(255,255,255,.25)}
.x{font-size:26px;color:var(--muted);padding:4px 8px}
.l-hearts{font-weight:900;color:var(--bad);font-size:19px;white-space:nowrap}
.l-body{flex:1;overflow:auto;padding:12px 24px 30px;width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
.l-foot{border-top:2px solid var(--line);padding:18px 24px calc(18px + env(safe-area-inset-bottom));background:var(--bg)}
.l-foot-in{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.l-foot.good{background:var(--ok-bg);border-color:transparent}
.l-foot.badf{background:var(--bad-bg);border-color:transparent}
.fb{flex:1;min-width:200px;display:flex;align-items:center;gap:14px}
.fb .fb-ico{width:60px;height:60px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.fb h3{font-size:22px;margin:0}
.good .fb h3,.good .fb{color:var(--ok-d)}
.badf .fb h3,.badf .fb{color:var(--bad-d)}
:root[data-theme="dark"] .good .fb,:root[data-theme="dark"] .good .fb h3{color:#5BE3AE}
:root[data-theme="dark"] .badf .fb,:root[data-theme="dark"] .badf .fb h3{color:#FF8DA0}
.fb .fb-ans{font-weight:700}
.l-foot .btn{min-width:150px}
.ex-tag{font-weight:900;color:var(--pri);text-transform:uppercase;font-size:13px;letter-spacing:.06em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ex-tag.new{color:var(--coral)}
.ex-tag.retry{color:var(--fire)}
.ex-title{font-size:26px;font-weight:900;margin:2px 0 20px}
@media(max-width:600px){.ex-title{font-size:21px}.l-top{padding:14px 16px}.l-body{padding:6px 16px 20px}.l-foot .btn{flex:1}}

/* choice cards with drawings */
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.pic{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:16px 10px 12px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.pic .big{font-size:68px;line-height:1.1}
.pic .w{font-weight:800;font-size:17px}
.pic .k{position:absolute;bottom:10px;right:10px;border:2px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.sel{border-color:var(--sky)!important;background:color-mix(in srgb,var(--sky) 12%,var(--card))!important;color:var(--sky)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 16px;text-align:left;background:var(--card);font-weight:700;font-size:17px;display:flex;align-items:center;gap:12px}
.opt .k{border:2px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);min-width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.drawing{font-size:110px;text-align:center;line-height:1.1;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;margin:0 auto 22px;width:190px}

.speaker-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px}
.speaker-row .pip{flex:none}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:19px;font-weight:700;background:var(--card);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bubble:before{content:"";position:absolute;left:-11px;bottom:18px;border:10px solid transparent;border-right-color:var(--line);border-left:0}
.bubble:after{content:"";position:absolute;left:-8px;bottom:19px;border:9px solid transparent;border-right-color:var(--card);border-left:0}
.spk{width:44px;height:44px;border-radius:12px;background:var(--sky);color:#fff;font-size:22px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #1C82CC;flex:none}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #1C82CC}
.spk.slow{background:var(--card2);color:var(--sky);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.big-spk{display:flex;gap:16px;justify-content:center;margin:10px 0 26px}
.big-spk .spk{width:110px;height:110px;border-radius:26px;font-size:52px;box-shadow:0 7px 0 #1C82CC}
.big-spk .spk.slow{width:76px;height:76px;align-self:flex-end;font-size:34px;box-shadow:0 6px 0 var(--line)}
.tw{border-bottom:2px dashed var(--muted);cursor:pointer;padding:0 1px}
.tw:hover{color:var(--pri)}
.hint-pop{position:fixed;z-index:300;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;box-shadow:var(--shadow);max-width:260px;font-size:15px}

/* tiles */
.answer-line{min-height:120px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 60px);margin-bottom:22px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:9px 14px;font-size:18px;font-weight:700;background:var(--card)}
.tile.used{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
.kb-toggle{align-self:flex-end;margin-top:12px}
textarea.typed,input.typed{width:100%;min-height:130px;border:2px solid var(--line);border-radius:16px;padding:14px;font-size:19px;background:var(--card2);resize:none}
input.typed{min-height:0}
textarea.typed:focus,input.typed:focus{outline:none;border-color:var(--sky)}

/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pairs .col{display:flex;flex-direction:column;gap:12px}
.pair{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px;font-weight:800;font-size:17px;background:var(--card);min-height:56px}
.pair.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);opacity:.5;pointer-events:none}
.pair.no{border-color:var(--bad);color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* fill */
.fill-sent{font-size:23px;font-weight:700;line-height:2;margin-bottom:6px}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--ink);text-align:center;color:var(--sky)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}

/* speak */
.mic{width:100%;padding:22px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-weight:900;color:var(--sky);font-size:18px;display:flex;align-items:center;justify-content:center;gap:12px;text-transform:uppercase;letter-spacing:.04em}
.mic.rec{border-color:var(--bad);color:var(--bad);animation:pulse2 1s infinite}
@keyframes pulse2{50%{background:var(--bad-bg)}}
.heard{margin-top:16px;font-size:18px;min-height:28px;text-align:center}
.wd-ok{color:var(--ok);font-weight:900} .wd-no{color:var(--bad);font-weight:900;text-decoration:underline wavy}
.speak-sent{font-size:24px;font-weight:800;line-height:1.6}
.cant{margin:22px auto 0;display:block}

/* minimal pairs */
.mp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mp .opt{justify-content:center;font-size:26px;padding:30px 10px;font-weight:900}

/* end screens */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}
.end h1{font-size:32px;color:var(--gold-d)}
.end-stats{display:flex;gap:12px;margin:18px 0;flex-wrap:wrap;justify-content:center}
.es{border:2px solid;border-radius:16px;min-width:120px;overflow:hidden}
.es .h{color:#fff;font-weight:900;font-size:13px;text-transform:uppercase;padding:5px}
.es .v{font-size:24px;font-weight:900;padding:12px 8px;background:var(--card)}
.confetti{position:fixed;top:-20px;font-size:24px;animation:fall linear forwards;pointer-events:none;z-index:400}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* story */
.st-line{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.st-line.new{animation:popin .25s}
.st-av{font-size:40px;line-height:1;flex:none;text-align:center;width:54px}
.st-av small{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}
.st-b{border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--card);font-size:18px;font-weight:700;cursor:pointer}
.st-b .fr{display:none;color:var(--muted);font-size:15px;font-weight:600;margin-top:4px}
.st-b.showfr .fr{display:block}
.st-q{border:2px solid var(--pri);border-radius:16px;padding:14px;margin:6px 0 16px;background:var(--pri-l)}
.st-q h3{font-size:18px}
.story-card{text-align:center;cursor:pointer;transition:transform .1s}
.story-card:hover{transform:translateY(-3px)}
.story-card .cover{font-size:64px;margin:6px 0}
.story-card.locked{opacity:.5;filter:grayscale(.8)}

/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(15,10,40,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.modal-box{background:var(--card);border-radius:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:24px;position:relative;animation:popin .18s}
.modal-x{position:absolute;top:12px;right:14px;font-size:22px;color:var(--muted)}
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);animation:popin .2s;text-align:center}

/* lists */
.word-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:2px solid var(--line)}
.word-row .e{font-size:30px;width:42px;text-align:center}
.word-row .t{flex:1;min-width:0}
.word-row .t b{display:block}
.str{width:70px}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px}
.lb-row.me{background:var(--pri-l);color:var(--pri)}
.lb-row .rk{width:28px;font-weight:900;text-align:center}
.lb-row .av{font-size:28px}
.lb-row .nm{flex:1;font-weight:800}
.lb-row .xp{font-weight:800;color:var(--muted)}
.zone{text-align:center;font-weight:900;font-size:13px;text-transform:uppercase;padding:6px;letter-spacing:.05em}
.zone.up{color:var(--ok)} .zone.down{color:var(--bad)}
.ach{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:14px}
.ach .ae{font-size:36px}
.ach.off{opacity:.45;filter:grayscale(1)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.set-row select,.set-row input[type=text]{border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--card2)}
.switch{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--ok)} .switch.on:after{left:25px}
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .c i{display:block;width:100%;max-width:38px;background:var(--pri);border-radius:8px 8px 4px 4px;min-height:3px}
.chart .c small{font-weight:800;color:var(--muted)}
.chart .c.today i{background:var(--gold)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat-box{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.stat-box .se{font-size:28px}
.stat-box b{display:block;font-size:20px}
.shop-item{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:2px solid var(--line)}
.shop-item .ie{font-size:52px;width:70px;text-align:center}
.shop-item .it{flex:1}
.method{display:flex;gap:12px;padding:10px 0}
.method .me{font-size:28px}
.guide-words{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:10px 0 20px}
.gw{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.gw .e{font-size:40px}
.phr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.phr .spk{width:36px;height:36px;font-size:17px}
.tips li{margin:8px 0;line-height:1.5}
.onb{text-align:center}
.goal-opts{display:grid;gap:10px;margin:16px 0}
.pip-bounce{animation:bob 1.2s ease-in-out infinite}
.combo-banner{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:var(--fire);color:#fff;font-weight:900;padding:10px 20px;border-radius:99px;z-index:150;animation:popin .2s}

/* ---------- Multilingue ---------- */
.rd{display:block;font-size:12px;font-weight:700;color:var(--muted);line-height:1.2;margin-top:2px}
ruby rt{font-size:.5em;font-weight:700;color:var(--muted)}
.tgt[dir=rtl],[dir=rtl] .tile,.bank[dir=rtl] .tile{font-size:1.12em}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:8px 0 14px}
.course-grid .opt{gap:10px;padding:12px}
.stat.flag{font-size:15px;gap:6px;color:var(--ink)}
.stat.flag .emoji{font-size:20px}
@media (max-width:700px){.stat.flag .cname{display:none}}

.install-banner{max-width:600px;margin:6px auto 4px;display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--pri);background:var(--pri-l);border-radius:16px}

/* ---------- Prof vidéo ---------- */
.prof{width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;position:relative;flex:none;border:3px solid var(--pri);box-shadow:0 4px 0 var(--pri-d);background:var(--card)}
.prof img,.prof video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prof video{opacity:0;transition:opacity .12s}
.prof.talking video{opacity:1}
.prof.talking{box-shadow:0 0 0 6px color-mix(in srgb,var(--pri) 25%,transparent),0 4px 0 var(--pri-d)}
.prof-big{display:flex;justify-content:center;margin:0 0 12px}
.prof-intro{max-width:600px;margin:8px auto;display:flex;gap:14px;align-items:center;padding:12px;border:2px solid var(--line);background:var(--card);border-radius:16px}
.prof-intro video{width:120px;aspect-ratio:9/16;border-radius:12px;background:#000;flex:none;max-width:40%}

/* =====================================================================
   THÈME CHAMPAGNE — verre transparent, liserés dorés (maquette validée)
   ===================================================================== */
:root{
  --bg:#ECE6DE; --card:rgba(255,255,255,.3); --card2:rgba(255,255,255,.2); --ink:#2F2A25; --muted:#4F4842; --line:rgba(160,130,95,.3);
  --pri:#86663D; --pri-d:#6E5434; --pri-l:rgba(201,169,122,.24);
  --ok:#4E7F57; --ok-d:#3B6644; --ok-bg:rgba(120,170,125,.22); --bad:#A4483F; --bad-d:#80352E; --bad-bg:rgba(210,120,110,.2);
  --gold:#C9A97A; --gold-d:#A8875C; --coral:#A9693A; --sky:#86663D; --fire:#A9693A;
  --glass:rgba(255,255,255,.3); --glass-b:rgba(255,255,255,.65); --solid:rgba(248,244,238,.96);
  --sky-grad:linear-gradient(168deg,#F1EDE8 0%,#E7E1D9 55%,#DDD5CA 100%);
  --glow:rgba(255,255,255,.9); --blob:rgba(196,168,132,.5);
  --shadow:0 10px 26px rgba(90,70,50,.12);
  --serif:'Cormorant Garamond',Georgia,serif;
}
:root[data-theme="dark"]{
  --bg:#615A53; --card:rgba(255,255,255,.12); --card2:rgba(255,255,255,.08); --ink:#F7F2EA; --muted:#EEE7DD; --line:rgba(255,255,255,.22);
  --pri:#E7D3B4; --pri-d:#C9A97A; --pri-l:rgba(231,211,180,.18); --ok-bg:rgba(120,170,125,.25); --bad-bg:rgba(210,120,110,.25);
  --sky:#E7D3B4; --glass:rgba(255,255,255,.12); --glass-b:rgba(255,255,255,.35); --solid:rgba(92,85,78,.97);
  --sky-grad:linear-gradient(180deg,#736C65 0%,#67615A 45%,#575149 100%); --glow:rgba(255,248,236,.45); --blob:rgba(226,204,170,.3);
  --shadow:0 10px 26px rgba(0,0,0,.25); color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#615A53; --card:rgba(255,255,255,.12); --card2:rgba(255,255,255,.08); --ink:#F7F2EA; --muted:#EEE7DD; --line:rgba(255,255,255,.22);
    --pri:#E7D3B4; --pri-d:#C9A97A; --pri-l:rgba(231,211,180,.18); --ok-bg:rgba(120,170,125,.25); --bad-bg:rgba(210,120,110,.25);
    --sky:#E7D3B4; --glass:rgba(255,255,255,.12); --glass-b:rgba(255,255,255,.35); --solid:rgba(92,85,78,.97);
    --sky-grad:linear-gradient(180deg,#736C65 0%,#67615A 45%,#575149 100%); --glow:rgba(255,248,236,.45); --blob:rgba(226,204,170,.3);
    --shadow:0 10px 26px rgba(0,0,0,.25); color-scheme:dark;
  }
}
html{background:var(--bg)}
body{background:transparent;font-family:'Jost',"Segoe UI",system-ui,sans-serif}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 38% at 88% 0%,var(--glow),transparent 72%),radial-gradient(50% 40% at 0% 100%,var(--blob),transparent 72%),
  linear-gradient(118deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%),var(--sky-grad)}
body::before{background:transparent}
h1,h2,h3,.ex-title,.logo,.fb h3,.end h1{font-family:var(--serif);font-weight:500;letter-spacing:0}
.page-title h1{font-size:34px}
.ex-title{font-size:29px}
.logo{color:var(--ink);font-size:30px}

/* surfaces en verre */
.card,.unit-head,.pic,.opt,.pair,.bubble,.mic,.stat-box,.ach,.drawing,.st-b,.install-banner,.prof-intro,.shop-item .ie{background:var(--glass);border:1px solid var(--glass-b);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.pic,.opt,.pair,.mic{border-bottom-width:1px}
.tile{background:var(--glass);border:1px solid var(--glass-b);border-bottom-width:1px;border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px rgba(90,70,50,.08)}
.tile.used{background:rgba(160,130,95,.12);border-color:transparent;box-shadow:none}
.side{border-right:1px solid var(--line)}
.nav-btn{text-transform:none;letter-spacing:.02em;font-weight:500;border-width:1px}
.nav-btn.on{background:var(--pri-l);color:var(--pri);border-color:rgba(201,169,122,.6)}
.topbar{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);margin:0 -24px;padding-left:24px;padding-right:24px}
@media (max-width:700px){.topbar{margin:0 -16px;padding-left:16px;padding-right:16px}}
.unit-head{top:calc(70px + env(safe-area-inset-top, 0px))}
.stat.fire{color:var(--fire)} .stat.gem{color:var(--pri)}
@media (max-width:700px){.side{background:var(--solid);border-top:1px solid var(--line)}}
#overlay{background:var(--bg)}
#overlay::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(55% 38% at 88% 0%,var(--glow),transparent 72%),var(--sky-grad)}
#overlay{isolation:isolate}
.l-foot{background:var(--glass);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.l-foot.good{background:var(--ok-bg)} .l-foot.badf{background:var(--bad-bg)}
.fb .fb-ico{background:var(--glass);border:1px solid var(--glass-b)}
.modal-box{background:var(--solid);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#modal{background:rgba(60,50,40,.35)}
.toast{background:rgba(60,54,48,.9);color:#F7F2EA;border-radius:999px}
.hint-pop{background:var(--solid)}

/* boutons */
.btn{border-radius:999px;border:1px solid var(--glass-b);border-bottom-width:1px;background:var(--glass);text-transform:none;letter-spacing:.04em;font-weight:500;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px rgba(90,70,50,.1);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn:active:not(:disabled){transform:translateY(1px);border-bottom-width:1px}
.btn.pri,.btn.gold{background:linear-gradient(180deg,rgba(242,232,217,.92),rgba(208,186,152,.85));border-color:rgba(255,255,255,.85);color:#2F2A25;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 10px 22px rgba(120,92,56,.22)}
.btn.ok{background:linear-gradient(180deg,#6E9C74,#4E7F57);border-color:rgba(255,255,255,.5);color:#fff}
.btn.bad{background:linear-gradient(180deg,#BE645A,#A4483F);border-color:rgba(255,255,255,.5);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost-w{background:var(--glass);border-color:var(--glass-b);color:var(--ink)}
.spk{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9),rgba(255,255,255,.3) 55%,rgba(214,198,178,.45));border:1px solid var(--glass-b);box-shadow:0 6px 14px rgba(90,70,50,.16);border-radius:50%}
.spk:active{box-shadow:0 2px 6px rgba(90,70,50,.16)}
.spk.slow{background:var(--glass);box-shadow:0 6px 14px rgba(90,70,50,.12)}
.big-spk .spk,.big-spk .spk.slow{box-shadow:0 10px 22px rgba(90,70,50,.18)}
.switch.on{background:var(--gold-d)}
.sel{border-color:var(--gold-d)!important;background:rgba(201,169,122,.26)!important;color:var(--pri)}
.pill{background:var(--pri-l);color:var(--pri)}
.bar{background:rgba(160,130,95,.18)} .bar>i,.bar.pri>i{background:linear-gradient(90deg,#C9A97A,#A8875C)} .bar.ok>i{background:#6E9C74}
.l-top .bar>i{background:linear-gradient(90deg,#C9A97A,#A8875C);box-shadow:none}
.answer-line{border-color:var(--line);background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 59px)}
.combo-banner{background:linear-gradient(180deg,#C9A97A,#A8875C);color:#2F2A25}

/* parcours : bandeaux de verre et perles champagne */
.unit-head{color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),var(--shadow);border-radius:24px}
.unit-head p{color:var(--muted)} .unit-kicker{color:var(--pri);opacity:1}
.unit.locked .unit-head{filter:none;opacity:.75}
.node{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95),rgba(236,220,196,.9) 50%,rgba(196,166,124,.95));color:#6E5434;border:1px solid rgba(255,255,255,.8);
  box-shadow:0 7px 0 rgba(150,120,85,.35),0 12px 24px rgba(90,70,50,.18)}
.node.done{background:radial-gradient(circle at 32% 26%,#F6E7C9,#D2AF77 55%,#A8875C);color:#fff;box-shadow:0 7px 0 #8E6E46,0 12px 24px rgba(90,70,50,.2)}
.node.lock{background:var(--glass);color:var(--muted);box-shadow:0 7px 0 rgba(150,120,85,.15)}
.node.chest,.node.trophy{background:transparent;border:0;box-shadow:none}
.node.cur{outline-color:rgba(201,169,122,.45)}
.start-tag{background:var(--solid);color:var(--pri);border:1px solid var(--glass-b);text-transform:none;letter-spacing:.04em}
.pop{background:var(--solid);color:var(--ink);border:1px solid var(--glass-b)}
.pop:before{border-bottom-color:var(--solid)}
.pop .btn{background:linear-gradient(180deg,rgba(242,232,217,.95),rgba(208,186,152,.9));color:#2F2A25}

/* accueil : ta prof en grand */
.hero{max-width:600px;margin:6px auto 26px;display:flex;flex-direction:column;gap:18px}
.hero-photo{position:relative;display:block;width:100%;height:min(440px,62vh);padding:6px;border-radius:28px;overflow:hidden;background:var(--glass);border:1px solid var(--glass-b);box-shadow:0 18px 40px rgba(90,70,50,.16)}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;border-radius:22px;display:block}
.hero-badge{position:absolute;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);font-size:12px;letter-spacing:.06em;color:#3B342E}
.hero-badge{left:16px;top:16px;text-transform:uppercase}.hero-badge i{width:7px;height:7px;border-radius:50%;background:#6E9C74}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:0 4px}
.hero-name{margin:0;font-family:var(--serif);font-weight:300;font-size:48px;line-height:.96}
.hero-row p{margin:8px 0 0;font-size:14px}
.hero-actions{display:grid;justify-items:center;gap:4px}
.hero-actions small{font-size:12px;color:var(--muted);margin-bottom:6px}
.pearl{width:58px;height:58px;border-radius:50%;font-size:24px;display:flex;align-items:center;justify-content:center;border:1px solid var(--glass-b);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85),rgba(255,255,255,.18) 55%,rgba(214,198,178,.3));box-shadow:0 8px 18px rgba(90,70,50,.16);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pearl.sm{width:42px;height:42px;font-size:18px;flex:none}
.hero-streak{display:flex;align-items:center;gap:12px;padding:0 4px;margin-top:-30px}
.hero-streak b{display:block;font-weight:500}.hero-streak small{color:var(--muted);font-size:12px}
.hero-line{height:1px;background:linear-gradient(90deg,transparent,rgba(184,149,106,.7),transparent)}
.hero-cta{height:60px;font-size:16px}

/* =====================================================================
   NOUVELLE INTERFACE : la prof en grand en haut, tout se passe en dessous
   ===================================================================== */
#stage{display:none}
body.stage-on{--stage-h:50dvh;--sheet:rgba(246,241,234,.9);height:100%;overflow:hidden}
body.stage-on.in-lesson{--stage-h:38dvh}
:root[data-theme="dark"] body.stage-on{--sheet:rgba(88,81,74,.92)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.stage-on{--sheet:rgba(88,81,74,.92)}}
body.stage-on #stage{display:block;position:fixed;top:0;left:0;right:0;max-width:600px;margin:0 auto;height:var(--stage-h);overflow:hidden;z-index:1;transition:height .35s ease;background:#CFC4B6}
#stage .st-img,#stage .st-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 6%}
#stage .st-idle{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 6%}
#stage .st-lip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 6%}
#stage .st-idle,#stage .st-vid,#stage .st-lip{opacity:0;transition:opacity .3s ease-in-out}
#stage video.show{opacity:1}
#stage .st-fade{position:absolute;inset:auto 0 0 0;height:48%;background:linear-gradient(rgba(40,32,26,0),rgba(40,32,26,.6));pointer-events:none}
#stage .st-top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
#stage .topbar{position:static;display:flex;gap:6px;background:none;margin:0;padding:0;-webkit-backdrop-filter:none;backdrop-filter:none}
#stage .stat{background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.75);border-radius:999px;padding:5px 11px;font-size:15px;color:#2F2A25}
#stage .stat.dim{filter:none;opacity:.85}
#stage .st-name{position:absolute;left:18px;bottom:46px;text-align:left;color:#FBF7F1;font-family:var(--serif);font-weight:300;font-size:40px;line-height:.95;text-shadow:0 2px 14px rgba(0,0,0,.4);transition:opacity .25s}
#stage .st-sub{display:block;font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.04em;margin-top:8px;color:#FBF7F1;font-weight:400}
#stage .st-caption{position:absolute;left:14px;right:14px;bottom:44px;padding:12px 16px;border-radius:20px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.85);color:#2F2A25;font-family:var(--serif);font-size:22px;line-height:1.2;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;pointer-events:none}
#stage.captioned .st-caption{opacity:1;transform:none}
#stage.captioned .st-name{opacity:0}
body.in-lesson #stage .st-name{opacity:0}

body.stage-on #app{display:block;position:fixed;left:0;right:0;bottom:0;top:calc(var(--stage-h) - 30px);max-width:600px;margin:0 auto;z-index:2;
  border-radius:30px 30px 0 0;background:var(--sheet);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:1px solid var(--glass-b);
  box-shadow:0 -14px 34px rgba(40,30,20,.16);overflow:hidden;transition:top .35s ease}
body.stage-on #main{height:100%;box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px calc(100px + env(safe-area-inset-bottom,0px))}
body.stage-on #main::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:rgba(120,100,75,.3);margin:-8px auto 14px}
body.stage-on #rail,body.stage-on .side .logo{display:none}
body.stage-on .side{position:absolute;top:auto;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:auto;z-index:5;display:flex;flex-direction:row;justify-content:space-around;
  padding:6px;border-radius:999px;background:var(--solid);border:1px solid var(--glass-b);box-shadow:0 10px 26px rgba(40,30,20,.18)}
body.stage-on .nav-btn{flex:1;min-width:0;justify-content:center;padding:8px 2px;border-radius:999px}
body.stage-on .nav-btn .nl{display:none}
body.stage-on .nav-btn .ni{font-size:20px;width:auto}
body.stage-on #overlay{top:calc(var(--stage-h) - 30px);left:0;right:0;bottom:0;max-width:600px;margin:0 auto;border-radius:30px 30px 0 0;background:var(--sheet);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:1px solid var(--glass-b);box-shadow:0 -14px 34px rgba(40,30,20,.18);z-index:100;overflow:hidden}
body.stage-on #overlay::before{display:none}
body.stage-on .l-top{padding:16px 18px 6px}
body.stage-on .l-body{padding:6px 18px 16px}
body.stage-on .ex-title{font-size:24px;margin-bottom:14px}
body.stage-on .speaker-row{margin-bottom:16px}
body.stage-on .bubble:before,body.stage-on .bubble:after{display:none}
body.stage-on .big-spk{margin:4px 0 16px}
body.stage-on .big-spk .spk{width:76px;height:76px;font-size:34px}
body.stage-on .big-spk .spk.slow{width:56px;height:56px;font-size:24px}
body.stage-on .drawing{font-size:80px;width:150px;padding:10px;margin-bottom:14px}
body.stage-on .end{justify-content:flex-start;padding-top:10px}
body.stage-on .l-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
body.stage-on .unit-head{top:0}
.mini-prof{border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.8);box-shadow:0 8px 18px rgba(90,70,50,.18)}

/* accueil : la leçon du jour et les chapitres */
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pri);font-weight:500}
.today{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),var(--shadow)}
.today h2{font-size:32px;margin:0;font-weight:400}.today p{margin:0}
.today-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.today-stats button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:16px;background:var(--card2);border:1px solid var(--glass-b);color:var(--ink)}
.today-stats b{font-weight:500;font-size:16px}.today-stats small{font-size:11px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:18px 0 4px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.quick-btn .pearl{width:52px;height:52px;font-size:21px}
.quick-btn small{font-size:12px;color:var(--muted)}
.chapter{padding:16px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),var(--shadow);margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.chapter.cur{border-color:rgba(201,169,122,.85);box-shadow:0 0 0 4px rgba(201,169,122,.22),var(--shadow)}
.chapter.locked{opacity:.7}
.ch-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ch-head h3{margin:4px 0 2px;font-size:23px;font-weight:500}.ch-head p{margin:0;font-size:14px}
.ch-btns{display:flex;flex-direction:column;gap:6px;flex:none}
.steps{display:flex;justify-content:space-between;gap:4px}
.step{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;color:#6E5434;border:1px solid rgba(255,255,255,.8);
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95),rgba(236,220,196,.9) 50%,rgba(196,166,124,.95));box-shadow:0 4px 10px rgba(90,70,50,.16)}
.step.done{background:radial-gradient(circle at 32% 26%,#F6E7C9,#D2AF77 55%,#A8875C);color:#fff}
.step.lock{background:var(--card2);color:var(--muted);box-shadow:none}
.step.cur{outline:3px solid rgba(201,169,122,.55);outline-offset:3px;animation:bob 1.6s ease-in-out infinite}
@media (min-width:601px){body.stage-on{background:transparent}}
body.stage-on #app{min-height:0;height:auto}

/* la prof libre : aucune pastille sur son image */
#stage .st-tap{position:absolute;inset:0;display:block;width:100%;height:100%;padding:0;border:0;background:none}
#stage .st-img{animation:breathe 9s ease-in-out infinite;transform-origin:50% 20%}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){#stage .st-img{animation:none}#stage .st-idle{display:none}}
body.stage-on #main::before{margin-bottom:10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 14px}
.sh-prof{display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:var(--ink);min-width:0}
.sh-prof b{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.05}
.sh-prof small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sheet-head .topbar{position:static;display:flex;gap:2px;padding:0;margin:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;flex:none}
.sheet-head .stat{font-size:14px;padding:5px 7px;border-radius:999px}
.sheet-head .stat.flag .cname{display:none}
.say-bubble{position:relative;margin:2px 18px 6px;padding:10px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-b);color:var(--ink);
  font-family:var(--serif);font-size:20px;line-height:1.2;display:none;align-items:center;gap:10px;box-shadow:var(--shadow)}
.say-bubble.on{display:flex;animation:popin .2s}
.say-bubble:before{content:"";position:absolute;left:34px;top:-8px;border:8px solid transparent;border-bottom-color:var(--glass-b);border-top:0}
.wave{display:inline-flex;align-items:flex-end;gap:2px;height:16px;flex:none}
.wave i{display:block;width:3px;border-radius:2px;background:var(--pri);animation:wave 1s ease-in-out infinite}
.wave i:nth-child(1){height:6px}.wave i:nth-child(2){height:14px;animation-delay:.15s}.wave i:nth-child(3){height:9px;animation-delay:.3s}.wave i:nth-child(4){height:12px;animation-delay:.45s}
@keyframes wave{50%{transform:scaleY(.4)}}

/* la scène et le panneau suivent la zone visible (clavier ouvert compris) */
body.stage-on{--stage-h:calc(var(--vv-h,100dvh) * .5)}
body.stage-on.in-lesson{--stage-h:calc(var(--vv-h,100dvh) * .38)}
body.stage-on.kb-open{--stage-h:calc(var(--vv-h,100dvh) * .3)}
body.stage-on #stage{top:var(--vv-top,0px)}
body.stage-on #app,body.stage-on #overlay{top:calc(var(--vv-top,0px) + var(--stage-h) - 30px);bottom:auto;height:calc(var(--vv-h,100dvh) - var(--stage-h) + 30px)}
body.stage-on.kb-open #stage,body.stage-on.kb-open #app,body.stage-on.kb-open #overlay{transition:none}
body.stage-on.kb-open .l-foot{padding-bottom:10px}
body.stage-on.kb-open .say-bubble{font-size:17px;padding:8px 12px}
body.stage-on.kb-open .ex-title{font-size:20px;margin-bottom:8px}
body.stage-on.kb-open .drawing{font-size:54px;width:100px;padding:6px;margin-bottom:8px}
body.stage-on.kb-open .big-spk{margin:0 0 8px}
body.stage-on.kb-open .big-spk .spk{width:56px;height:56px;font-size:26px}
body.stage-on.kb-open .big-spk .spk.slow{width:44px;height:44px;font-size:20px}
body.stage-on.kb-open textarea.typed{min-height:70px}
body.stage-on.kb-open .say-bubble{display:none!important}
body.stage-on.kb-open .l-top{padding:10px 18px 2px}
body.stage-on.kb-open .l-foot .btn{padding:9px 14px;font-size:13px;min-width:0;letter-spacing:.02em}
body.stage-on.kb-open .l-foot-in{flex-wrap:nowrap}

/* bulle d'encouragement */
.say-bubble small.tr{font-family:'Jost',sans-serif;font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.say-bubble.cheer.good{border-color:rgba(110,156,116,.7);background:var(--ok-bg)}
.say-bubble.cheer.bad{border-color:rgba(190,100,90,.6);background:var(--bad-bg)}

/* matières : niveaux, cours, figures */
.lvl-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 14px}
.lvl{border:1px solid var(--glass-b);background:var(--glass);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);min-width:0}
.lvl b{font-weight:600;font-size:13px;letter-spacing:.02em}
.lvl small{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.lvl.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(120,90,50,.25)}
.lvl.on small{color:rgba(255,255,255,.85)}
.cours-card{background:var(--glass);border:1px solid var(--glass-b);border-radius:22px;padding:16px 18px;margin:4px 0 12px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.cours-emoji{font-size:44px;line-height:1}
.cours-txt{font-size:18px;line-height:1.5;margin:0}
.subj-fig{display:flex;justify-content:center;margin:2px 0 14px}
.subj-fig svg{max-width:100%;height:auto;background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;padding:6px}
.subj-fig.sm svg{width:150px}
.count-fig{font-size:34px;line-height:1.3;text-align:center;letter-spacing:4px;max-width:340px;margin:0 auto}
body.stage-on.kb-open .subj-fig svg{max-height:110px;width:auto}
body.stage-on.kb-open .count-fig{font-size:22px}
body.stage-on.kb-open .l-body .mic{display:none}
/* cours d'Amara en diapositives */
.cours-dots{display:flex;justify-content:center;gap:6px;margin:0 0 10px}
.cours-dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.cours-dots i.on{background:var(--pri);width:34px}.cours-dots i.done{background:var(--pri);opacity:.45}
.cours-head{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;color:var(--pri);display:flex;align-items:center;gap:8px}
.cours-card.slide-3{border-color:rgba(190,110,80,.5)}
.cours-ex-t{font-weight:600;font-size:18px;margin:0}
.cours-steps{text-align:left;margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.45;width:100%}
.cours-steps li{opacity:.12;transform:translateY(4px);transition:opacity .45s,transform .45s}
.cours-steps li.on{opacity:1;transform:none}
.hint-btn{display:block;margin:0 auto 12px}
.hint-box{margin:0 0 12px;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px dashed var(--pri);font-size:16px;line-height:1.45}
.fb-why{margin-top:6px;font-size:15px;line-height:1.4}
.method-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;margin:6px 0 4px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-b);color:var(--ink)}
.method-card .emoji{font-size:28px}.method-card span:nth-child(2){flex:1;display:flex;flex-direction:column}.method-card small{color:var(--muted)}
.guide-lesson{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.gl{background:var(--glass);border:1px solid var(--glass-b);border-radius:16px;padding:12px 14px}
.gl p,.gl ol{margin:6px 0 0;line-height:1.45}.gl ol{padding-left:20px}
.gl.warn{border-color:rgba(190,110,80,.5)}
body.stage-on.kb-open .hint-btn,body.stage-on.kb-open .hint-box{display:none}

/* pas de rebond de la page entière sur iPhone pendant les exercices */
body.stage-on{overscroll-behavior:none}
body.stage-on.in-lesson{position:fixed;inset:0;width:100%}
</style>

  zh: { name: "Chinois", adj: "chinois", flag: "🇨🇳", tts: "zh-CN", sr: "zh-CN",

<script>/* =====================================================================

   Question : { q (affichée), say (lue à voix haute, si différente), o (choix, le 1er est le bon) ou ans (réponses acceptées),
                fig (dessin), ex (explication), num (réponse numérique), tol (tolérance) }
   Les questions de maths et de géométrie sont générées une fois pour toutes (graine fixe),

const LEVELS = [

/* ---------- outils de génération ---------- */
function rngFor(key) { let h = 2166136261; for (const ch of key) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return mulberry32(h); }

const pickR = (r, arr) => arr[Math.floor(r() * arr.length)];
const nf = x => String(x).replace('.', ','); // écriture française des décimaux
const sayNum = x => String(x).replace('-', 'moins ').replace('.', ' virgule ');
function numQ(q, say, ans, ex, extra) { return Object.assign({ q, say, ans: [String(ans), nf(ans)], num: ans, ex }, extra || {}); }
function uniqOpts(correct, wrongs) { const seen = new Set([String(correct)]); const w = []; for (const x of wrongs) { const k = String(x); if (!seen.has(k)) { seen.add(k); w.push(x); } } return [correct, ...w.slice(0, 3)]; }

/* ---------- dessins (SVG) pour la géométrie ---------- */
const SVG_STYLE = 'fill="rgba(201,169,122,.22)" stroke="#8C6F4A" stroke-width="3" stroke-linejoin="round"';
const svg = (inner, w = 220, h = 160) => `<svg class="fig" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Figure">${inner}</svg>`;
const lbl = (x, y, t, a = 'middle') => `<text x="${x}" y="${y}" text-anchor="${a}" font-size="15" font-family="Jost, sans-serif" fill="#3B342E">${t}</text>`;
function polySvg(n) {
  const pts = []; for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; pts.push(`${(110 + 62 * Math.cos(a)).toFixed(1)},${(82 + 62 * Math.sin(a)).toFixed(1)}`); }
  return svg(`<polygon points="${pts.join(' ')}" ${SVG_STYLE}/>`);
}
const SHAPES = {
  carré: () => svg(`<rect x="55" y="25" width="110" height="110" ${SVG_STYLE}/>`),
  rectangle: () => svg(`<rect x="25" y="40" width="170" height="85" ${SVG_STYLE}/>`),
  triangle: () => polySvg(3), cercle: () => svg(`<circle cx="110" cy="80" r="62" ${SVG_STYLE}/>`),

};
function rectSvg(L, l, unit = 'cm') { return svg(`<rect x="30" y="35" width="160" height="90" ${SVG_STYLE}/>${lbl(110, 26, `${L} ${unit}`)}${lbl(200, 85, `${l} ${unit}`, 'start')}`, 260, 140); }
function squareSvg(c, unit = 'cm') { return svg(`<rect x="60" y="25" width="100" height="100" ${SVG_STYLE}/>${lbl(110, 17, `${c} ${unit}`)}`, 220, 140); }
function rightTriSvg(a, b, c, unit = 'cm') {
  return svg(`<polygon points="40,130 40,30 190,130" ${SVG_STYLE}/><rect x="40" y="114" width="16" height="16" fill="none" stroke="#8C6F4A" stroke-width="2"/>${lbl(32, 85, a ? `${a} ${unit}` : '?', 'end')}${lbl(115, 152, b ? `${b} ${unit}` : '?')}${lbl(125, 72, c ? `${c} ${unit}` : '?', 'start')}`, 240, 160);
}

}

/* ---------- générateurs de questions ---------- */
const OBJ = [['🍎', 'pommes'], ['⭐', 'étoiles'], ['🐟', 'poissons'], ['🎈', 'ballons'], ['🌸', 'fleurs'], ['🚗', 'voitures'], ['🐱', 'chats'], ['🍪', 'biscuits']];
const NAMES_FR = ['Léa', 'Hugo', 'Inès', 'Lucas', 'Jade', 'Noah', 'Chloé', 'Adam', 'Amara', 'Yanis'];

  add20: r => { const a = ri(r, 1, 10), b = ri(r, 1, 10), big = Math.max(a, b), sm = Math.min(a, b);
    return numQ(`Combien font ${a} + ${b} ?`, `Combien font ${a} plus ${b} ?`, a + b, a + b > 10 && big < 10 ? `Passe par 10 : ${big} + ${10 - big} = 10, puis 10 + ${sm - (10 - big)} = ${a + b}.` : `Pars de ${big} et avance de ${sm} : ${a + b}.`, { hint: `Pars du plus grand nombre, ${big}, et avance de ${sm}.` }); },
  sub20: r => { const a = ri(r, 6, 20), b = ri(r, 1, a - 1), u = a - 10;

  count: r => { const [e, n] = pickR(r, OBJ), k = ri(r, 2, 10); return numQ(`Combien y a-t-il de ${n} ?`, null, k, `Il y en a ${k}.`, { fig: countFig(e, k) }); },
  compare: r => { let a = ri(r, 1, 99), b = ri(r, 1, 99); if (a === b) b = a + ri(r, 1, 9); return { q: 'Quel nombre est le plus grand ?', o: [String(Math.max(a, b)), String(Math.min(a, b))], ex: `${Math.max(a, b)} est plus grand que ${Math.min(a, b)}.` }; },
  double: r => { const a = ri(r, 2, 25); return r() < .5 ? numQ(`Quel est le double de ${a} ?`, null, 2 * a, `Le double de ${a}, c'est ${a} + ${a} = ${2 * a}.`) : numQ(`Quelle est la moitié de ${2 * a} ?`, null, a, `La moitié de ${2 * a}, c'est ${a}.`); },
  mul: r => { const a = ri(r, 2, 10), b = ri(r, 2, 10);
    return numQ(`Combien font ${a} × ${b} ?`, `Combien font ${a} fois ${b} ?`, a * b, a === 10 || b === 10 ? `Multiplier par 10, c'est ajouter un zéro à droite : ${a * b}.` : a === 2 ? `${a} × ${b}, c'est le double de ${b} : ${b} + ${b} = ${a * b}.` : `${a} × ${b}, ce sont ${a} paquets de ${b}. ${a - 1} × ${b} = ${(a - 1) * b}, et un paquet de plus : ${(a - 1) * b} + ${b} = ${a * b}.`, { hint: a === 10 || b === 10 ? 'Multiplier par 10, c\'est ajouter un zéro à droite.' : a === 2 ? `C'est le double de ${b}.` : `Pense à ${a - 1} × ${b}, puis ajoute encore ${b}.` }); },
  add3: r => { const a = ri(r, 120, 899), b = ri(r, 15, 99); return r() < .5 ? numQ(`Combien font ${a} + ${b} ?`, `Combien font ${a} plus ${b} ?`, a + b, `${a} + ${b} = ${a + b}`) : numQ(`Combien font ${a} − ${b} ?`, `Combien font ${a} moins ${b} ?`, a - b, `${a} − ${b} = ${a - b}`); },
  div: r => { const b = ri(r, 2, 9), k = ri(r, 2, 10), a = b * k; return numQ(`Combien font ${a} ÷ ${b} ?`, `Combien font ${a} divisé par ${b} ?`, k, `${a} ÷ ${b} = ${k}, car ${b} × ${k} = ${a}.`, { hint: `Récite la table de ${b} : quel nombre multiplié par ${b} donne ${a} ?` }); },
  prob: r => {
    const n = pickR(r, NAMES_FR), a = ri(r, 5, 30), b = ri(r, 2, 15), t = ri(r, 0, 3);

/* version à voix haute d'un texte écrit (symboles, chiffres romains, sigles) */
const ROMAN_SAY = { XIV: 'quatorze', XVI: 'seize', XV: 'quinze', XIII: 'treize', XVIIIe: 'dix-huitième', XIXe: 'dix-neuvième', XXe: 'vingtième', XXIe: 'vingt-et-unième', XVIe: 'seizième', XVIIe: 'dix-septième' };
function speakable(t) {
  return String(t)
    .replace(/\b(cos|sin|tan)(²?)\(([^)]*)\)/g, (m, f, sq, a) => ({ cos: 'cosinus', sin: 'sinus', tan: 'tangente' })[f] + (sq ? ' carré' : '') + ' de ' + a)
    .replace(/(\d+)°/g, '$1 degrés').replace(/°/g, ' degrés').replace(/π/g, 'pi')
    .replace(/²/g, ' au carré').replace(/³/g, ' au cube').replace(/×/g, ' fois ').replace(/÷/g, ' divisé par ').replace(/√/g, 'racine carrée de ')
    .replace(/(\d+)\s*%/g, '$1 pour cent').replace(/(\d+)\/(\d+)/g, '$1 sur $2')
    .replace(/\b(XVIIIe|XIXe|XXe|XXIe|XVIe|XVIIe|XIV|XVI|XV|XIII)\b/g, m => ROMAN_SAY[m])
    .replace(/\bURSS\b/g, 'U.R.S.S.').replace(/\bONU\b/g, "l'O.N.U.").replace(/l'l'O/g, "l'O").replace(/\bSOH CAH TOA\b/g, 'so, ca, toa')
    .replace(/\(−\s?(\d+)\)/g, 'moins $1').replace(/\s\+\s/g, ' plus ').replace(/\s=\s/g, ' égale ').replace(/\s[−–]\s/g, ' moins ').replace(/−(\d)/g, 'moins $1')
    .replace(/(\d)\s?€/g, '$1 euros').replace(/⁴/g, ' puissance 4').replace(/·/g, ' fois ').replace(/\b([A-Z]{2})\/([A-Z]{2})\b/g, '$1 sur $2').replace(/[()]/g, ' ')
    .replace(/\s+([,.?!])/g, '$1').replace(/\s{2,}/g, ' ').trim();
}

/* génère les questions de chaque chapitre (une fois, avec une graine fixe) */
function subjectItems(code, k, ch) {
  if (ch.items) return ch.items;
  if (ch.dict) return ch.dict.map(text => ({ dict: text }));
  const r = rngFor(`${code}-${k}`), gens = Array.isArray(ch.gen) ? ch.gen : [ch.gen], out = [], seen = new Set();
  for (let guard = 0; out.length < 18 && guard < 400; guard++) { const it = GEN[gens[guard % gens.length]](r); const key = it.q + (it.fig || ''); if (seen.has(key)) continue; seen.add(key); if (it.o) it.o = uniqOpts(it.o[0], it.o.slice(1)); out.push(it); }
  return out;
}

      exemple: { titre: 'Calculons 3 + 4 × 5', steps: ["Il n'y a pas de parenthèses.", 'La multiplication passe en premier : 4 × 5 = 20.', 'Puis l\'addition : 3 + 20 = 23.'] },
      astuce: "Retiens : les parenthèses d'abord, puis fois et divisé, et plus et moins en dernier.",
      piege: "Ne calcule pas simplement de gauche à droite : 3 + 4 × 5 ne fait pas 35 !" },
    { idee: "Un pourcentage, c'est une part sur 100. 50 %, c'est la moitié. 25 %, c'est le quart. 10 %, c'est un dixième.",
      exemple: { titre: 'Calculons 30 % de 80', steps: ['10 % de 80, c\'est 80 ÷ 10 = 8.', '30 %, c\'est trois fois 10 % : 3 × 8 = 24.', 'Donc 30 % de 80 = 24.'] },
      astuce: "Commence toujours par 10 % : il suffit de diviser par 10. Et 5 %, c'est la moitié de 10 %.",
      piege: "Un pourcentage dépend du nombre de départ : 50 % de 10, c'est 5, mais 50 % de 1000, c'est 500." },
    { idee: "Une équation, c'est une balance en équilibre. Pour trouver x, on fait la même chose des deux côtés, pour que la balance reste droite.",
      exemple: { titre: 'Résolvons 3x + 4 = 19', steps: ["J'enlève 4 des deux côtés : 3x = 15.", 'Je divise les deux côtés par 3 : x = 5.', 'Je vérifie : 3 × 5 + 4 = 19. C\'est juste !'] },
      astuce: "Défais les opérations dans l'ordre inverse : on enlève d'abord ce qui est ajouté, puis on divise ce qui est multiplié. Et vérifie toujours en remplaçant x.",
      piege: "Ce que tu fais d'un côté, fais-le aussi de l'autre côté, sinon la balance penche et le résultat est faux." },
    { idee: ['Une puissance est une multiplication répétée : 2³ = 2 × 2 × 2 = 8. La racine carrée fait l\'inverse du carré : √25 = 5, car 5 × 5 = 25.', "Une puissance est une multiplication répétée : 2 puissance 3, c'est 2 fois 2 fois 2, soit 8. La racine carrée fait l'inverse du carré : racine carrée de 25 égale 5, car 5 fois 5 font 25."],
      exemple: { titre: ['Calculons 3⁴ puis √49', 'Calculons 3 puissance 4, puis racine carrée de 49'], steps: [['3⁴ = 3 × 3 × 3 × 3.', '3 puissance 4, c\'est 3 fois 3 fois 3 fois 3.'], ['3 × 3 = 9, puis × 3 = 27, puis × 3 = 81.', '3 fois 3 font 9, fois 3 font 27, fois 3 font 81.'], ['√49 : quel nombre fois lui-même donne 49 ? C\'est 7.', 'Racine carrée de 49 : quel nombre multiplié par lui-même donne 49 ? C\'est 7.']] },
      astuce: "Apprends les carrés par cœur jusqu'à 15 × 15 = 225 : les racines deviennent alors très faciles.",
      piege: ["2³ ne fait pas 2 × 3 = 6 ! L'exposant dit combien de fois on multiplie le nombre par lui-même.", "2 puissance 3 ne fait pas 2 fois 3 ! L'exposant dit combien de fois on multiplie le nombre par lui-même."] },
    { idee: ['Trois formules font gagner beaucoup de temps : (a + b)² = a² + 2ab + b², (a − b)² = a² − 2ab + b², et (a − b)(a + b) = a² − b².', "Trois formules font gagner beaucoup de temps : a plus b au carré égale a carré plus 2 a b plus b carré. a moins b au carré égale a carré moins 2 a b plus b carré. Et a moins b, fois a plus b, égale a carré moins b carré."],
      exemple: { titre: ['Développons (x + 3)²', 'Développons x plus 3, au carré'], steps: [['Ici, a = x et b = 3.', 'Ici, a vaut x et b vaut 3.'], ['a² = x², 2ab = 2 × x × 3 = 6x, b² = 9.', 'a carré donne x carré. 2 a b donne 2 fois x fois 3, soit 6 x. b carré donne 9.'], ['Donc (x + 3)² = x² + 6x + 9.', 'Donc x plus 3 au carré égale x carré plus 6 x plus 9.']] },
      astuce: "Imagine un grand carré de côté a + b découpé en 4 morceaux : un carré a², un carré b², et deux rectangles a fois b. Voilà d'où vient le 2ab !",
      piege: ['(x + 3)² ne fait pas x² + 9 : n\'oublie jamais le double produit 2ab.', 'x plus 3 au carré ne fait pas x carré plus 9 : n\'oublie jamais le double produit, 2 a b.'] },
    { idee: "La dérivée mesure à quelle vitesse une fonction change, comme le compteur d'une voiture mesure à quelle vitesse la distance change.",
      exemple: { titre: ['Dérivons f(x) = 3x² + 5x', 'Dérivons f de x égale 3 x carré plus 5 x'], steps: [['Règle : la dérivée de xⁿ est n·xⁿ⁻¹. Pour 3x², on descend le 2 : 3 × 2x = 6x.', 'Règle : la dérivée de x puissance n est n fois x puissance n moins 1. Pour 3 x carré, on descend le 2 : 3 fois 2 x, soit 6 x.'], ['La dérivée de 5x est 5.', 'La dérivée de 5 x est 5.'], ["Donc f'(x) = 6x + 5.", 'Donc f prime de x égale 6 x plus 5.']] },
      astuce: "Dérive chaque morceau séparément, puis additionne. Et la dérivée d'un nombre tout seul vaut toujours 0.",
      piege: ['N\'oublie pas de baisser l\'exposant de 1 : la dérivée de x³ est 3x², pas 3x³.', 'N\'oublie pas de baisser l\'exposant de 1 : la dérivée de x au cube est 3 x carré, pas 3 x au cube.'] }

  geometrie: [
    { idee: "Chaque figure a sa carte d'identité : le nombre de côtés, leur longueur, et les angles. Le carré a 4 côtés égaux et 4 angles droits.",
      exemple: { titre: 'Reconnaissons un rectangle', steps: ['Je compte les côtés : il y en a 4.', 'Je regarde les coins : ce sont 4 angles droits, comme le coin d\'une feuille.', 'Les côtés face à face sont égaux, mais pas tous les quatre : c\'est un rectangle.'] },
      astuce: "Un carré est un rectangle très spécial, dont tous les côtés sont égaux. Le losange, lui, a 4 côtés égaux mais pas d'angle droit.",
      piege: "Un cercle n'a ni côté ni coin : ce n'est pas un polygone." },
    { idee: "Le nom d'une figure dit souvent son nombre de côtés : tri veut dire 3, penta veut dire 5, hexa veut dire 6, octo veut dire 8.",
      exemple: { titre: "Comptons les côtés d'un hexagone", steps: ['Je pose mon doigt sur un coin.', 'Je suis chaque côté en comptant : un, deux, trois, quatre, cinq, six.', 'Je reviens à mon point de départ : 6 côtés, c\'est un hexagone.'] },
      astuce: "Pense à la pieuvre, l'octopus, qui a 8 bras : un octogone a 8 côtés. Et les alvéoles des abeilles sont des hexagones.",
      piege: "Marque le coin de départ, sinon tu risques de compter un côté deux fois." },
    { idee: "Le périmètre, c'est la longueur du tour d'une figure, comme une fourmi qui marche tout autour.",
      exemple: { titre: 'Périmètre d\'un rectangle de 8 cm sur 3 cm', steps: ['Le tour, c\'est longueur + largeur + longueur + largeur.', '8 + 3 + 8 + 3 = 22.', 'Ou plus vite : 2 × (8 + 3) = 2 × 11 = 22 cm.'] },
      astuce: "Pour un carré, les 4 côtés sont égaux : périmètre = 4 × côté.",
      piege: "Ne confonds pas périmètre et aire : le périmètre est une longueur, en cm, l'aire est une surface, en cm²." },
    { idee: "L'aire, c'est la surface à l'intérieur d'une figure : le nombre de petits carreaux de 1 cm de côté qu'on peut poser dedans.",
      exemple: { titre: 'Aire d\'un rectangle de 5 cm sur 3 cm', steps: ['Je peux poser 3 rangées de 5 carreaux.', '3 × 5 = 15 carreaux.', "L'aire est donc 15 cm²."] },
      astuce: "Un triangle rectangle, c'est un rectangle coupé en deux par la diagonale : son aire, c'est base × hauteur, divisé par 2.",
      piege: "L'aire s'écrit en unités carrées : cm², m². On multiplie les longueurs, on ne les additionne pas." },
    { idee: "Un angle mesure l'ouverture entre deux traits, comme l'ouverture des aiguilles d'une horloge. Il se mesure en degrés avec un rapporteur.",
      exemple: { titre: 'Classons un angle de 120°', steps: ['Je compare avec l\'angle droit, qui mesure 90°.', '120° est plus ouvert que 90° mais moins que 180°.', 'C\'est donc un angle obtus.'] },
      astuce: "Aigu, c'est pointu, moins de 90°. Droit, c'est le coin d'une feuille, 90°. Obtus, c'est plus ouvert. Plat, c'est une ligne droite, 180°. Et dans un triangle, les trois angles font toujours 180° en tout.",
      piege: "La longueur des traits ne change pas l'angle : seule l'ouverture compte." },
    { idee: "Dans un triangle rectangle, le côté le plus long, en face de l'angle droit, s'appelle l'hypoténuse. Pythagore a découvert que son carré est égal à la somme des carrés des deux autres côtés.",
      exemple: { titre: ['Triangle rectangle de côtés 3 cm et 4 cm', 'Un triangle rectangle de côtés 3 et 4 centimètres'], steps: [['3² + 4² = 9 + 16 = 25.', '3 au carré plus 4 au carré égale 9 plus 16, soit 25.'], ['L\'hypoténuse au carré vaut 25.', "L'hypoténuse au carré vaut 25."], ['Hypoténuse = √25 = 5 cm.', 'L\'hypoténuse vaut racine carrée de 25, soit 5 centimètres.']] },
      astuce: "Retiens le triangle 3, 4, 5 : c'est le plus célèbre. Les maçons l'utilisent depuis l'Antiquité pour tracer des angles droits avec une corde !",
      piege: "Pour trouver un petit côté, on soustrait : côté² = hypoténuse² − autre côté². On n'additionne pas dans ce cas." },
    { idee: "Le rayon va du centre au bord du cercle. Le diamètre traverse tout le cercle : il vaut deux rayons. Le nombre pi, environ 3,14, relie le tour du cercle à son diamètre.",
      exemple: { titre: 'Cercle de rayon 5 cm', steps: ['Périmètre = 2 × π × r = 2 × 3,14 × 5 = 31,4 cm.', 'Aire = π × r × r = 3,14 × 5 × 5 = 78,5 cm².'] },
      astuce: "Le tour d'un cercle mesure toujours un peu plus de 3 fois son diamètre. Essaie avec une ficelle autour d'une assiette !",
      piege: "Ne confonds pas rayon et diamètre : si on te donne le diamètre, divise-le d'abord par 2." },
    { idee: "Le volume mesure la place occupée à l'intérieur d'un objet : le nombre de petits cubes de 1 cm de côté qu'on peut y ranger.",
      exemple: { titre: 'Volume d\'un pavé de 4 cm × 3 cm × 2 cm', steps: ['Au fond, je pose 4 × 3 = 12 petits cubes.', 'J\'empile 2 étages : 12 × 2 = 24.', 'Le volume est 24 cm³.'] },
      astuce: "Pour tous les « tubes » droits, pavé ou cylindre : volume = aire du fond × hauteur.",
      piege: "Le volume s'écrit en unités cubes : cm³, m³. Et 1 litre, c'est 1 dm³, soit 1000 cm³." },
    { idee: "Thalès dit que si on trace une parallèle à un côté d'un triangle, on obtient un petit triangle qui est un agrandissement réduit du grand : toutes les longueurs sont proportionnelles.",
      exemple: { titre: 'AM = 2, AB = 6, AC = 9 : combien vaut AN ?', steps: ['Le petit triangle est 3 fois plus petit, car 6 ÷ 2 = 3.', 'Donc AN = AC ÷ 3 = 9 ÷ 3 = 3.', 'On peut écrire : AM/AB = AN/AC, soit 2/6 = 3/9.'] },
      astuce: "Pense à une photo réduite : tout est divisé par le même nombre, le coefficient de réduction.",
      piege: "Les droites doivent être parallèles, sinon on ne peut pas utiliser Thalès. Et compare toujours les côtés qui se correspondent." },
    { idee: "La trigonométrie relie les angles et les côtés d'un triangle rectangle avec trois outils : le sinus, le cosinus et la tangente.",
      exemple: { titre: 'Triangle rectangle : hypoténuse 10, côté opposé à l\'angle 6', steps: ['Sinus = opposé ÷ hypoténuse.', 'Sinus = 6 ÷ 10 = 0,6.', 'Avec la calculatrice, on retrouve l\'angle : environ 37°.'] },
      astuce: ["Retiens le mot magique SOH CAH TOA : Sinus = Opposé/Hypoténuse, Cosinus = Adjacent/Hypoténuse, Tangente = Opposé/Adjacent.", "Retiens le mot magique : so, ca, toa. Sinus égale opposé sur hypoténuse. Cosinus égale adjacent sur hypoténuse. Tangente égale opposé sur adjacent."],
      piege: "Le côté opposé et le côté adjacent dépendent de l'angle que tu regardes : repère toujours l'angle d'abord." }

  francais: [
    { idee: "Chaque mot a une nature, comme un métier. Le nom désigne une personne, un animal ou une chose. Le verbe dit l'action. L'adjectif décrit le nom. Le déterminant annonce le nom.",
      exemple: { titre: 'Analysons : « Le petit chat dort. »', steps: ['« Le » annonce le nom : c\'est un déterminant.', '« petit » décrit le chat : c\'est un adjectif.', '« chat » est un animal : c\'est un nom.', '« dort » dit ce que fait le chat : c\'est un verbe.'] },
      astuce: "Pour trouver un verbe, change le temps : « il dort » devient « il dormait ». Si le mot change, c'est un verbe. Pour un nom, essaie de mettre « le » ou « un » devant.",
      piege: "Un même mot peut changer de nature : dans « le dîner », dîner est un nom ; dans « nous allons dîner », c'est un verbe." },
    { idee: "Les noms et les adjectifs changent de forme selon le genre, masculin ou féminin, et le nombre, singulier ou pluriel.",
      exemple: { titre: 'Mettons au pluriel : « un beau château »', steps: ['« un » devient « des ».', '« beau » se termine par -eau : il prend un x, « beaux ».', '« château » aussi : « châteaux ».', 'Résultat : « des beaux châteaux ».'] },
      astuce: "En général, on ajoute un s au pluriel et un e au féminin. Retiens la phrase des 7 mots en -ou qui prennent un x : « Viens, mon chou, mon bijou, mon joujou, sur mes genoux, et jette des cailloux à ce hibou plein de poux ».",
      piege: "Certains mots ne changent pas au pluriel : ceux qui finissent déjà par s, x ou z, comme une souris, des souris." },
    { idee: "Conjuguer, c'est accorder le verbe avec la personne qui fait l'action : je, tu, il, nous, vous, ils.",
      exemple: { titre: 'Conjuguons « chanter » au présent', steps: ['Je retire -er pour trouver le radical : chant.', "J'ajoute les terminaisons : e, es, e, ons, ez, ent.", 'Je chante, tu chantes, il chante, nous chantons, vous chantez, ils chantent.'] },
      astuce: "Pour les verbes en -er, la terminaison -ent de « ils » ne se prononce pas : « ils chantent » se dit comme « il chante ».",
      piege: "Être, avoir, aller et faire sont irréguliers : « vous êtes », « vous faites », « ils vont ». Il faut les apprendre par cœur." },
    { idee: "Les homophones se prononcent pareil mais s'écrivent différemment et n'ont pas le même sens : a et à, est et et, son et sont, ou et où.",
      exemple: { titre: 'Choisissons entre « a » et « à » : « Il … faim. »', steps: ['Je remplace par « avait » : « Il avait faim. »', 'La phrase a du sens : c\'est le verbe avoir.', 'J\'écris « a » sans accent : « Il a faim. »'] },
      astuce: "Les remplacements magiques : a → avait. Est → était. Et → et puis. Son → mon. Sont → étaient. Ou → ou bien. Si ça marche, tu as trouvé !",
      piege: "« Où » avec un accent indique un lieu : « Où vas-tu ? ». Sans accent, « ou » propose un choix : « du thé ou du café »." },
    { idee: "Le passé composé raconte une action terminée : « j'ai mangé ». L'imparfait décrit le décor ou une habitude du passé : « il faisait beau ».",
      exemple: { titre: 'Conjuguons « aller » au passé composé avec « elles »', steps: ['« Aller » se conjugue avec l\'auxiliaire être : elles sont.', 'Le participe passé est « allé ».', 'Avec être, il s\'accorde avec le sujet, ici féminin pluriel : « elles sont allées ».'] },
      astuce: "La plupart des verbes utilisent avoir. Ceux qui utilisent être sont surtout des verbes de mouvement : aller, venir, partir, arriver, entrer, sortir, naître, mourir, tomber, rester.",
      piege: "Pour savoir si le participe finit par é, i ou u, mets-le au féminin : « prise » donne « pris », « finie » donne « fini »." },
    { idee: "Accorder, c'est faire porter aux mots les mêmes marques que le mot dont ils dépendent : le genre et le nombre.",
      exemple: { titre: 'Accordons : « Les fleurs que j\'ai cueilli… »', steps: ['Le verbe est conjugué avec avoir.', 'Je cherche le complément : « que », qui remplace « les fleurs », placé avant le verbe.', 'Il est féminin pluriel : « les fleurs que j\'ai cueillies ».'] },
      astuce: "Avec être, le participe s'accorde avec le sujet. Avec avoir, jamais avec le sujet : seulement avec le complément d'objet direct s'il est placé avant.",
      piege: "Les adjectifs de couleur qui sont des noms, comme orange ou marron, restent invariables : « des robes orange »." },
    { idee: "Le subjonctif exprime ce qui n'est pas certain : un souhait, un doute, une obligation, un sentiment. On le trouve souvent après « que ».",
      exemple: { titre: 'Complétons : « Il faut que tu … (faire) tes devoirs. »', steps: ['« Il faut que » exprime une obligation : on utilise le subjonctif.', 'Le subjonctif de faire est « que tu fasses ».', '« Il faut que tu fasses tes devoirs. »'] },
      astuce: "Pour tester, remplace par le verbe faire : « il faut que je fasse ». Si tu dirais « fasse », c'est bien le subjonctif.",
      piege: "Après « si », jamais de conditionnel : « si j'avais », pas « si j'aurais ». Et après « après que », on met l'indicatif." },
    { idee: "Une figure de style est une façon originale de dire les choses, pour créer une image ou une émotion chez le lecteur.",
      exemple: { titre: 'Analysons : « Cette femme est une rose. »', steps: ['On rapproche une femme et une rose.', 'Il n\'y a pas d\'outil de comparaison comme « comme ».', 'C\'est donc une métaphore. Avec « comme », ce serait une comparaison.'] },
      astuce: "L'hyperbole exagère : « je meurs de faim ». La litote dit moins pour faire comprendre plus : « ce n'est pas mauvais ». L'oxymore unit deux contraires : « une obscure clarté ».",
      piege: "La comparaison a toujours un outil, comme « comme », « tel » ou « pareil à ». La métaphore n'en a pas." }
  ],
  dictee: [
    { idee: "Une phrase commence toujours par une majuscule et se termine par un point. Entre les deux, chaque mot est séparé par un espace.",
      exemple: { titre: 'Comment réussir une dictée', steps: ['J\'écoute la phrase en entier, sans écrire.', 'J\'écris en répétant les mots dans ma tête.', 'Je me relis : la majuscule, les accords, le point final.'] },
      astuce: "Relis-toi trois fois : une fois pour le sens, une fois pour les accords, une fois pour les accents et la ponctuation.",

    { idee: "Dans une phrase, les mots forment des équipes : le nom, ses adjectifs et son déterminant portent les mêmes marques, et le verbe s'accorde avec le sujet.",
      exemple: { titre: 'Écrivons « les enfants jouent »', steps: ['« les » est au pluriel : « enfants » prend un s.', 'Qui joue ? Les enfants : le sujet est au pluriel.', 'Le verbe prend -ent : « jouent ».'] },
      astuce: "Pour trouver le sujet, pose la question « qui est-ce qui ? » devant le verbe.",
      piege: "Le sujet peut être loin du verbe : « Les oiseaux du jardin chantent » : ce sont les oiseaux qui chantent, pas le jardin." },
    { idee: "Les homophones sont des mots qui sonnent pareil. Pour bien les écrire en dictée, il faut réfléchir au sens de la phrase.",
      exemple: { titre: 'Écrivons « Il a donné son cahier à sa voisine »', steps: ['« a » : je peux dire « il avait donné », c\'est le verbe avoir.', '« son » cahier : je peux dire « mon cahier », c\'est un déterminant.', '« à » sa voisine : je ne peux pas dire « avait », donc à prend un accent.'] },
      astuce: "Utilise les remplacements magiques : avait, était, mon, étaient, ou bien. Ils marchent aussi en dictée.",
      piege: "« Leur » devant un nom pluriel prend un s : « leurs affaires ». Devant un verbe, jamais : « je leur parle »." },
    { idee: "Une phrase longue contient plusieurs informations reliées par des virgules ou des petits mots comme qui, que, quand, malgré.",
      exemple: { titre: 'Découpons une phrase longue', steps: ['Je repère le verbe principal et son sujet.', 'Je repère les morceaux ajoutés, souvent entre virgules.', 'J\'accorde chaque verbe avec son propre sujet.'] },
      astuce: "Après « qui », le verbe s'accorde avec le mot que « qui » remplace : « les élèves qui avaient terminé ».",
      piege: "Un complément placé en début de phrase est suivi d'une virgule : « Pendant les vacances, nous sommes partis »." },
    { idee: "Le passé simple est le temps des récits et des contes : il raconte les actions principales de l'histoire, une par une.",
      exemple: { titre: 'Écrivons « Le roi entra et salua ses invités »', steps: ['« entrer » est un verbe en -er.', 'Au passé simple, avec il, il se termine par -a : « il entra ».', 'Même chose pour « saluer » : « il salua ».'] },
      astuce: "Verbes en -er : ai, as, a, âmes, âtes, èrent. Les autres verbes : is, is, it, îmes, îtes, irent, ou us, us, ut, ûmes, ûtes, urent.",
      piege: "Avec nous et vous, n'oublie pas l'accent circonflexe : « nous fûmes », « vous chantâtes »." },
    { idee: "Un texte littéraire utilise des mots riches et des phrases bien construites. Écouter attentivement chaque mot permet de bien l'écrire.",
      exemple: { titre: 'Préparer un texte long', steps: ['J\'écoute le texte en entier pour comprendre l\'histoire.', 'J\'écris en suivant le rythme de la voix, groupe de mots par groupe de mots.', 'Je me relis en vérifiant les accords des adjectifs et des participes.'] },
      astuce: "Les adjectifs s'accordent avec le nom qu'ils décrivent, même s'ils sont éloignés : « la vieille demeure, enveloppée de brume ».",
      piege: "Les participes passés employés comme adjectifs s'accordent aussi : « des voyageurs épuisés »." },
    { idee: "Certains mots du français ont une orthographe surprenante, souvent héritée du grec ou du latin. Il faut les mémoriser.",
      exemple: { titre: 'Mémorisons « rhinocéros »', steps: ['« rh » vient du grec : on ne l\'entend pas, mais il est là.', 'Le son « o » s\'écrit simplement o.', 'Il finit par un s, même au singulier : un rhinocéros.'] },
      astuce: "Pour retenir un mot difficile, découpe-le en syllabes, épelle-le à voix haute, puis écris-le de mémoire.",

  histoire: [

const TIERS = [['Bronze', '🥉', '#CD7F32'], ['Argent', '🥈', '#94A3B8'], ['Or', '🥇', '#F5B700'], ['Saphir', '💎', '#2F6FED'], ['Rubis', '🔴', '#E0245E'],

function weekXP(w = weekId()) { let s = 0; for (const [d, x] of Object.entries(S.xpDays)) if (weekId(dayNum(d)) === w) s += x; return s; }
function leagueBoard(w = weekId(), tier = S.league.tier, frac = weekFrac(), myXP = weekXP(w)) {
  const r = mulberry32(w * 97 + tier * 13 + 7);
  const names = seededShuffle(BOT_NAMES, r).slice(0, 19);
  const bots = names.map(n => {
    const target = Math.floor((25 + r() * (110 + tier * 60)) * (r() < .15 ? 2.5 : 1));
    const speed = .6 + r() * .9, av = AVATARS[Math.floor(r() * AVATARS.length)];
    return { name: n, av, xp: Math.round(target * Math.pow(clamp(frac, 0, 1), speed)) };
  });
  bots.push({ name: S.name || 'Toi', av: '🦜', xp: myXP, me: true });
  return bots.sort((a, b) => b.xp - a.xp || (a.me ? -1 : 1));
}
function settleLeague() {

  const w = L.week, xp = weekXP(w);
