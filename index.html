<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeakUp — Apprends les langues</title>
<meta name="theme-color" content="#6C4CF5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="SpeakUp">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F5F3FF; --card:#FFFFFF; --card2:#FAF9FF; --ink:#1E1B3A; --muted:#6B6890; --line:#E5E1F5;
  --pri:#6C4CF5; --pri-d:#4F31D6; --pri-l:#EDE8FF;
  --ok:#12B07A; --ok-d:#0B8A5E; --ok-bg:#DCF7EA;
  --bad:#EF4562; --bad-d:#C62944; --bad-bg:#FDE4E8;
  --gold:#FFB800; --gold-d:#D99A00; --coral:#FF7A59; --sky:#2EA8FF; --fire:#FF8A00;
  --shadow:0 8px 24px rgba(40,20,120,.08);
  --r:18px;
}
:root[data-theme="dark"]{
  --bg:#13111F; --card:#1E1B2E; --card2:#252238; --ink:#F1EFFF; --muted:#A39FC4; --line:#332F4D;
  --pri:#8B70FF; --pri-d:#6A4DEB; --pri-l:#2C2650; --ok-bg:#123A2D; --bad-bg:#431C26; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13111F; --card:#1E1B2E; --card2:#252238; --ink:#F1EFFF; --muted:#A39FC4; --line:#332F4D;
    --pri:#8B70FF; --pri-d:#6A4DEB; --pri-l:#2C2650; --ok-bg:#123A2D; --bad-bg:#431C26; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:25;background:var(--bg)}
input,textarea,select{font:inherit;color:var(--ink)}
h1,h2,h3{margin:0 0 .4em;font-weight:900;letter-spacing:-.01em}
p{margin:.3em 0}
.muted{color:var(--muted)}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:240px minmax(0,1fr) 340px;min-height:100vh;max-width:1400px;margin:0 auto}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:26px;color:var(--pri);padding:6px 10px 18px}
.logo svg{flex:none}
.nav-btn{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;font-weight:800;color:var(--muted);text-align:left;border:2px solid transparent;font-size:15px;text-transform:uppercase;letter-spacing:.03em}
.nav-btn .ni{font-size:24px;width:30px;text-align:center}
.nav-btn:hover{background:var(--card2)}
.nav-btn.on{background:var(--pri-l);color:var(--pri);border-color:var(--pri)}
#main{padding:0 24px 120px;min-width:0}
#rail{padding:20px 20px 40px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:16px}
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--bg);display:flex;justify-content:flex-end;gap:6px;padding:14px 0 10px}
.stat{display:flex;align-items:center;gap:6px;font-weight:900;padding:6px 10px;border-radius:12px;font-size:17px}
.stat:hover{background:var(--card2)}
.stat.fire{color:var(--fire)} .stat.gem{color:var(--sky)} .stat.heart{color:var(--bad)} .stat.flag{margin-right:auto}
.stat.dim{filter:grayscale(1);opacity:.6}

@media (max-width:1100px){ #app{grid-template-columns:88px minmax(0,1fr)} #rail{display:none} .nav-btn span.nl{display:none} .logo span{display:none} .nav-btn{justify-content:center} }
@media (max-width:700px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:2px solid var(--line);background:var(--card);z-index:30}
  .logo{display:none}
  .nav-btn{padding:8px 4px;border-radius:12px;flex:1;min-width:0}
  .nav-btn .ni{font-size:22px;width:auto}
  #main{padding:0 16px 110px}
}

/* ---------- Cards / buttons ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:16px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;font-size:15px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;transition:transform .06s, filter .15s}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--pri);border-color:var(--pri-d);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok-d);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad-d);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold-d);color:#3a2800}
.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost-w{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff;padding:9px 14px;font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:800;font-size:12px;background:var(--pri-l);color:var(--pri)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.page-title{display:flex;align-items:center;gap:14px;margin:8px 0 20px}
.page-title h1{font-size:28px;margin:0}
.section-h{font-size:20px;margin:28px 0 12px}

/* ---------- Path ---------- */
.unit{margin:10px auto 40px;max-width:600px}
.unit-head{background:var(--uc);color:#fff;border-radius:var(--r);padding:18px 20px;display:flex;gap:12px;justify-content:space-between;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.18);position:sticky;top:calc(64px + env(safe-area-inset-top, 0px));z-index:5}
.unit-head h2{font-size:22px;margin:2px 0}
.unit-head p{opacity:.9;font-weight:700;margin:0}
.unit-kicker{font-weight:900;opacity:.85;text-transform:uppercase;font-size:13px;letter-spacing:.06em}
.unit-btns{display:flex;flex-direction:column;gap:6px}
.unit.locked .unit-head{filter:saturate(.25) brightness(.9)}
.nodes{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:34px 0 10px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:76px;height:70px;border-radius:50%;background:var(--uc);color:#fff;font-size:30px;font-weight:900;box-shadow:0 8px 0 rgba(0,0,0,.22), inset 0 -6px 0 rgba(0,0,0,.08);transition:transform .1s;display:flex;align-items:center;justify-content:center}
.node:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.node.lock{background:var(--line);color:var(--muted);box-shadow:0 8px 0 rgba(0,0,0,.12)}
.node.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-d)}
.node.chest,.node.trophy{background:transparent;box-shadow:none;font-size:52px}
.node.chest.lock,.node.trophy.lock{filter:grayscale(1);opacity:.55}
.node.cur{outline:6px solid color-mix(in srgb,var(--uc) 30%,transparent);outline-offset:6px;animation:pulse 1.8s infinite}
.node.chest.cur,.node.trophy.cur{outline:none;animation:wiggle 1.6s infinite}
@keyframes pulse{50%{outline-offset:10px}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
.start-tag{position:absolute;top:-46px;background:var(--card);border:2px solid var(--line);color:var(--uc);font-weight:900;text-transform:uppercase;padding:7px 12px;border-radius:12px;white-space:nowrap;font-size:14px;animation:bob 1.4s ease-in-out infinite;z-index:2}
.start-tag:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line);border-bottom:0}
@keyframes bob{50%{transform:translateY(-5px)}}
.deco{position:absolute;top:110px;font-size:80px;pointer-events:none;opacity:.95}
.deco.left{left:6%} .deco.right{right:6%}
@media(max-width:560px){.deco{display:none}}
.pop{position:absolute;left:50%;transform:translateX(-50%);width:min(290px,calc(100vw - 40px));background:var(--uc);color:#fff;border-radius:16px;padding:16px;z-index:10;box-shadow:var(--shadow);animation:fadein .15s ease-out}
@keyframes fadein{from{opacity:0}}
.pop:before{content:"";position:absolute;top:-9px;left:var(--ax,50%);margin-left:-9px;border:9px solid transparent;border-bottom-color:var(--uc);border-top:0}
.pop.lockp{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.pop.lockp:before{border-bottom-color:var(--line)}
.pop h3{font-size:18px;margin-bottom:4px}
.pop .btn{width:100%;margin-top:12px;background:#fff;color:var(--uc);border-color:rgba(0,0,0,.15)}
@keyframes popin{from{transform:scale(.9);opacity:0}}

/* ---------- Rail widgets ---------- */
.goal-ring{display:flex;align-items:center;gap:14px}
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.bar.pri>i{background:var(--pri)} .bar.ok>i{background:var(--ok)}
.q-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.q-row+.q-row{border-top:2px solid var(--line)}
.q-ico{font-size:30px;width:40px;text-align:center}
.q-main{flex:1;min-width:0}
.q-main b{display:block;margin-bottom:6px}

/* ---------- Overlay (lesson / story) ---------- */
#overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column}
#overlay.on{display:flex}
.l-top{display:flex;align-items:center;gap:16px;padding:calc(20px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 20px max(24px, env(safe-area-inset-left, 0px));max-width:1000px;width:100%;margin:0 auto}
.l-top .bar{flex:1;height:18px}
.l-top .bar>i{background:var(--ok);box-shadow:inset 0 -5px 0 rgba(255,255,255,.25)}
.x{font-size:26px;color:var(--muted);padding:4px 8px}
.l-hearts{font-weight:900;color:var(--bad);font-size:19px;white-space:nowrap}
.l-body{flex:1;overflow:auto;padding:12px 24px 30px;width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
.l-foot{border-top:2px solid var(--line);padding:18px 24px calc(18px + env(safe-area-inset-bottom));background:var(--bg)}
.l-foot-in{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.l-foot.good{background:var(--ok-bg);border-color:transparent}
.l-foot.badf{background:var(--bad-bg);border-color:transparent}
.fb{flex:1;min-width:200px;display:flex;align-items:center;gap:14px}
.fb .fb-ico{width:60px;height:60px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.fb h3{font-size:22px;margin:0}
.good .fb h3,.good .fb{color:var(--ok-d)}
.badf .fb h3,.badf .fb{color:var(--bad-d)}
:root[data-theme="dark"] .good .fb,:root[data-theme="dark"] .good .fb h3{color:#5BE3AE}
:root[data-theme="dark"] .badf .fb,:root[data-theme="dark"] .badf .fb h3{color:#FF8DA0}
.fb .fb-ans{font-weight:700}
.l-foot .btn{min-width:150px}
.ex-tag{font-weight:900;color:var(--pri);text-transform:uppercase;font-size:13px;letter-spacing:.06em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ex-tag.new{color:var(--coral)}
.ex-tag.retry{color:var(--fire)}
.ex-title{font-size:26px;font-weight:900;margin:2px 0 20px}
@media(max-width:600px){.ex-title{font-size:21px}.l-top{padding:14px 16px}.l-body{padding:6px 16px 20px}.l-foot .btn{flex:1}}

/* choice cards with drawings */
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.pic{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:16px 10px 12px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.pic .big{font-size:68px;line-height:1.1}
.pic .w{font-weight:800;font-size:17px}
.pic .k{position:absolute;bottom:10px;right:10px;border:2px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.sel{border-color:var(--sky)!important;background:color-mix(in srgb,var(--sky) 12%,var(--card))!important;color:var(--sky)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 16px;text-align:left;background:var(--card);font-weight:700;font-size:17px;display:flex;align-items:center;gap:12px}
.opt .k{border:2px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);min-width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.drawing{font-size:110px;text-align:center;line-height:1.1;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;margin:0 auto 22px;width:190px}

.speaker-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px}
.speaker-row .pip{flex:none}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:19px;font-weight:700;background:var(--card);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bubble:before{content:"";position:absolute;left:-11px;bottom:18px;border:10px solid transparent;border-right-color:var(--line);border-left:0}
.bubble:after{content:"";position:absolute;left:-8px;bottom:19px;border:9px solid transparent;border-right-color:var(--card);border-left:0}
.spk{width:44px;height:44px;border-radius:12px;background:var(--sky);color:#fff;font-size:22px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #1C82CC;flex:none}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #1C82CC}
.spk.slow{background:var(--card2);color:var(--sky);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.big-spk{display:flex;gap:16px;justify-content:center;margin:10px 0 26px}
.big-spk .spk{width:110px;height:110px;border-radius:26px;font-size:52px;box-shadow:0 7px 0 #1C82CC}
.big-spk .spk.slow{width:76px;height:76px;align-self:flex-end;font-size:34px;box-shadow:0 6px 0 var(--line)}
.tw{border-bottom:2px dashed var(--muted);cursor:pointer;padding:0 1px}
.tw:hover{color:var(--pri)}
.hint-pop{position:fixed;z-index:300;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;box-shadow:var(--shadow);max-width:260px;font-size:15px}

/* tiles */
.answer-line{min-height:120px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 60px);margin-bottom:22px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:9px 14px;font-size:18px;font-weight:700;background:var(--card)}
.tile.used{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
.kb-toggle{align-self:flex-end;margin-top:12px}
textarea.typed,input.typed{width:100%;min-height:130px;border:2px solid var(--line);border-radius:16px;padding:14px;font-size:19px;background:var(--card2);resize:none}
input.typed{min-height:0}
textarea.typed:focus,input.typed:focus{outline:none;border-color:var(--sky)}

/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pairs .col{display:flex;flex-direction:column;gap:12px}
.pair{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px;font-weight:800;font-size:17px;background:var(--card);min-height:56px}
.pair.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);opacity:.5;pointer-events:none}
.pair.no{border-color:var(--bad);color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* fill */
.fill-sent{font-size:23px;font-weight:700;line-height:2;margin-bottom:6px}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--ink);text-align:center;color:var(--sky)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}

/* speak */
.mic{width:100%;padding:22px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-weight:900;color:var(--sky);font-size:18px;display:flex;align-items:center;justify-content:center;gap:12px;text-transform:uppercase;letter-spacing:.04em}
.mic.rec{border-color:var(--bad);color:var(--bad);animation:pulse2 1s infinite}
@keyframes pulse2{50%{background:var(--bad-bg)}}
.heard{margin-top:16px;font-size:18px;min-height:28px;text-align:center}
.wd-ok{color:var(--ok);font-weight:900} .wd-no{color:var(--bad);font-weight:900;text-decoration:underline wavy}
.speak-sent{font-size:24px;font-weight:800;line-height:1.6}
.cant{margin:22px auto 0;display:block}

/* minimal pairs */
.mp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mp .opt{justify-content:center;font-size:26px;padding:30px 10px;font-weight:900}

/* end screens */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}
.end h1{font-size:32px;color:var(--gold-d)}
.end-stats{display:flex;gap:12px;margin:18px 0;flex-wrap:wrap;justify-content:center}
.es{border:2px solid;border-radius:16px;min-width:120px;overflow:hidden}
.es .h{color:#fff;font-weight:900;font-size:13px;text-transform:uppercase;padding:5px}
.es .v{font-size:24px;font-weight:900;padding:12px 8px;background:var(--card)}
.confetti{position:fixed;top:-20px;font-size:24px;animation:fall linear forwards;pointer-events:none;z-index:400}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* story */
.st-line{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.st-line.new{animation:popin .25s}
.st-av{font-size:40px;line-height:1;flex:none;text-align:center;width:54px}
.st-av small{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:2px}
.st-b{border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--card);font-size:18px;font-weight:700;cursor:pointer}
.st-b .fr{display:none;color:var(--muted);font-size:15px;font-weight:600;margin-top:4px}
.st-b.showfr .fr{display:block}
.st-q{border:2px solid var(--pri);border-radius:16px;padding:14px;margin:6px 0 16px;background:var(--pri-l)}
.st-q h3{font-size:18px}
.story-card{text-align:center;cursor:pointer;transition:transform .1s}
.story-card:hover{transform:translateY(-3px)}
.story-card .cover{font-size:64px;margin:6px 0}
.story-card.locked{opacity:.5;filter:grayscale(.8)}

/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(15,10,40,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.modal-box{background:var(--card);border-radius:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:24px;position:relative;animation:popin .18s}
.modal-x{position:absolute;top:12px;right:14px;font-size:22px;color:var(--muted)}
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);animation:popin .2s;text-align:center}

/* lists */
.word-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:2px solid var(--line)}
.word-row .e{font-size:30px;width:42px;text-align:center}
.word-row .t{flex:1;min-width:0}
.word-row .t b{display:block}
.str{width:70px}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px}
.lb-row.me{background:var(--pri-l);color:var(--pri)}
.lb-row .rk{width:28px;font-weight:900;text-align:center}
.lb-row .av{font-size:28px}
.lb-row .nm{flex:1;font-weight:800}
.lb-row .xp{font-weight:800;color:var(--muted)}
.zone{text-align:center;font-weight:900;font-size:13px;text-transform:uppercase;padding:6px;letter-spacing:.05em}
.zone.up{color:var(--ok)} .zone.down{color:var(--bad)}
.ach{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:14px}
.ach .ae{font-size:36px}
.ach.off{opacity:.45;filter:grayscale(1)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.set-row select,.set-row input[type=text]{border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--card2)}
.switch{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--ok)} .switch.on:after{left:25px}
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .c i{display:block;width:100%;max-width:38px;background:var(--pri);border-radius:8px 8px 4px 4px;min-height:3px}
.chart .c small{font-weight:800;color:var(--muted)}
.chart .c.today i{background:var(--gold)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat-box{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.stat-box .se{font-size:28px}
.stat-box b{display:block;font-size:20px}
.shop-item{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:2px solid var(--line)}
.shop-item .ie{font-size:52px;width:70px;text-align:center}
.shop-item .it{flex:1}
.method{display:flex;gap:12px;padding:10px 0}
.method .me{font-size:28px}
.guide-words{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:10px 0 20px}
.gw{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.gw .e{font-size:40px}
.phr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.phr .spk{width:36px;height:36px;font-size:17px}
.tips li{margin:8px 0;line-height:1.5}
.onb{text-align:center}
.goal-opts{display:grid;gap:10px;margin:16px 0}
.pip-bounce{animation:bob 1.2s ease-in-out infinite}
.combo-banner{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:var(--fire);color:#fff;font-weight:900;padding:10px 20px;border-radius:99px;z-index:150;animation:popin .2s}

/* ---------- Multilingue ---------- */
.rd{display:block;font-size:12px;font-weight:700;color:var(--muted);line-height:1.2;margin-top:2px}
ruby rt{font-size:.5em;font-weight:700;color:var(--muted)}
.tgt[dir=rtl],[dir=rtl] .tile,.bank[dir=rtl] .tile{font-size:1.12em}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:8px 0 14px}
.course-grid .opt{gap:10px;padding:12px}
.stat.flag{font-size:15px;gap:6px;color:var(--ink)}
.stat.flag .emoji{font-size:20px}
@media (max-width:700px){.stat.flag .cname{display:none}}
</style>

const TIERS = [['Bronze', '🥉', '#CD7F32'], ['Argent', '🥈', '#94A3B8'], ['Or', '🥇', '#F5B700'], ['Saphir', '💎', '#2F6FED'], ['Rubis', '🔴', '#E0245E'],
  ['Émeraude', '🟢', '#10B981'], ['Améthyste', '🔮', '#9B5DE5'], ['Perle', '🦪', '#C9B79C'], ['Obsidienne', '⚫', '#333'], ['Diamant', '💠', '#4CC9F0']];
function weekXP(w = weekId()) { let s = 0; for (const [d, x] of Object.entries(S.xpDays)) if (weekId(dayNum(d)) === w) s += x; return s; }
function leagueBoard(w = weekId(), tier = S.league.tier, frac = weekFrac(), myXP = weekXP(w)) {
  const r = mulberry32(w * 97 + tier * 13 + 7);
  const names = seededShuffle(BOT_NAMES, r).slice(0, 19);
  const bots = names.map(n => {
    const target = Math.floor((25 + r() * (110 + tier * 60)) * (r() < .15 ? 2.5 : 1));
    const speed = .6 + r() * .9, av = AVATARS[Math.floor(r() * AVATARS.length)];
    return { name: n, av, xp: Math.round(target * Math.pow(clamp(frac, 0, 1), speed)) };
  });
  bots.push({ name: S.name || 'Toi', av: '🦜', xp: myXP, me: true });
  return bots.sort((a, b) => b.xp - a.xp || (a.me ? -1 : 1));
}
function settleLeague() {
  const L = S.league; if (L.week === weekId()) return;
  const w = L.week, xp = weekXP(w);
  if (xp > 0) {
    const board = leagueBoard(w, L.tier, 1, xp), rank = board.findIndex(r => r.me) + 1;
    let res = 'stay';
    if (rank <= 7 && L.tier < TIERS.length - 1) { L.tier++; res = 'up'; } else if (rank >= 16 && L.tier > 0) { L.tier--; res = 'down'; }
    L.last = { rank, res, tier: L.tier };
    setTimeout(() => {
      if (res === 'up') { confetti(); openModal(`<div class="onb">${pip('happy', 120)}<h2>Promotion !</h2><p>Tu as fini ${rank}<sup>e</sup> la semaine dernière. Bienvenue en ligue <b>${TIERS[L.tier][0]}</b> ${TIERS[L.tier][1]}</p><button class="btn pri wide" data-act="closeModal">Génial</button></div>`); }
      else if (res === 'down') openModal(`<div class="onb">${pip('sad', 120)}<h2>Rétrogradation</h2><p>Tu as fini ${rank}<sup>e</sup>. Tu redescends en ligue ${TIERS[L.tier][0]}. On remonte cette semaine ?</p><button class="btn pri wide" data-act="closeModal">C'est parti</button></div>`);

  }
  L.week = weekId(); save();
}

function ensureQuests() {
  const t = dayStr(); if (S.quests && S.quests.day === t) return;
  const r = mulberry32(todayNum() * 31 + 5);
  const mk = q => ({ k: q.k, n: q.n[Math.floor(r() * q.n.length)], p: 0, claimed: false, gems: 10 + Math.floor(r() * 3) * 5 });
  const list = [mk(QUEST_T[0])];
  const pool = QUEST_T.slice(1);
  while (list.length < 3 && pool.length) list.push(mk(pool.splice(Math.floor(r() * pool.length), 1)[0]));
  S.quests = { day: t, list }; save();
}
function questProgress(k, v = 1) {
  ensureQuests();
  S.quests.list.forEach(q => { if (q.k !== k) return; const was = q.p >= q.n; q.p = k === 'combo' ? Math.max(q.p, v) : q.p + v; if (!was && q.p >= q.n) setTimeout(() => toast(`🎯 Quête accomplie : ${QUEST_T.find(x => x.k === k).txt(q.n)}`), 400); });
}

  return `<div class="q-row"><span class="q-ico emoji">${T.e}</span><div class="q-main"><b>${T.txt(q.n)}</b><div class="bar"><i style="width:${clamp(q.p / q.n * 100, 0, 100)}%"></i></div></div>

}
const ACH = [
  { id: 'first', e: '🐣', t: 'Premiers pas', d: 'Termine ta première leçon', f: () => S.stats.lessons >= 1 },

const SPEAKY = new Set(['speak', 'speak_word', 'shadow']);
const LISTENY = new Set(['listen_tiles', 'listen_type', 'minimal', 'listen_pick']);
function fixType(t) {
  if (!canListen()) t = { listen_tiles: 'tr_en', listen_type: 'tr_en', listen_pick: 'what' }[t] || t;
  if (t === 'speak') { const m = speakMode(); t = m === 'mic' ? 'speak' : m === 'shadow' ? 'shadow' : canListen() ? 'listen_tiles' : 'tr_fr'; }
  return t;
}
function sentEx(s, t) { return { t: fixType(t), s }; }
function chunk(arr, k, parts) { const size = Math.ceil(arr.length / parts); return arr.slice(k * size, (k + 1) * size); }
function wordExercises(ws, n, types) { return shuffle(ws).slice(0, n).map((w, i) => ({ t: fixType(types[i % types.length]), w })); }
function pairsEx(ws) {
  const seen = new Set(), pick = [];
  for (const w of shuffle(ws)) { if (seen.has(w.fr) || seen.has(w.en)) continue; seen.add(w.fr); seen.add(w.en); pick.push(w); if (pick.length === 5) break; }
  return pick.length >= 3 ? { t: 'pairs', ws: pick } : null;
}
function buildUnitLesson(u, l) {
  const U = UNITS[u], W = U.words, St = U.sents, ex = [], rest = [];
  if (l < 4) {
    const newW = chunk(W, l, 4), oldW = W.slice(0, Math.ceil(W.length / 4) * l);
    const newS = chunk(St, l, 4), oldS = St.slice(0, Math.ceil(St.length / 4) * l);
    const allW = newW.concat(oldW);
    newW.forEach(w => ex.push({ t: 'img', w, isNew: !S.words[w.en] }));
    rest.push(...wordExercises(allW, 2, ['what', 'listen_pick']));
    if (l > 0) rest.push({ t: 'type_tr', w: rand(allW) });
    const p = pairsEx(allW); if (p) rest.push(p);
    newS.forEach((s, k) => { rest.push(sentEx(s, k % 2 ? 'tr_fr' : 'tr_en')); rest.push(sentEx(s, rand(['listen_tiles', 'speak', 'fill', 'choose_tr']))); });
    shuffle(oldS).slice(0, 3).forEach(s => rest.push(sentEx(s, rand(['tr_en', 'listen_type', 'speak', 'tr_fr', 'fill']))));
    return ex.concat(shuffle(rest)).slice(0, 16);
  }
  if (l === 4) {
    const p = pairsEx(W); if (p) rest.push(p);
    rest.push(...wordExercises(W, 3, ['what', 'type_tr', 'listen_pick']));
    const types = ['tr_en', 'tr_fr', 'listen_tiles', 'speak', 'fill', 'choose_tr', 'listen_type', 'tr_en', 'speak'];
    shuffle(St).slice(0, 9).forEach((s, i) => rest.push(sentEx(s, types[i])));
    return shuffle(rest);
  }
  // l === 5 : évaluation
  rest.push(...wordExercises(W, 2, ['type_tr']));
  const types = ['tr_en', 'listen_type', 'speak', 'tr_en', 'listen_tiles', 'tr_fr', 'fill', 'speak', 'tr_en', 'listen_type', 'tr_fr', 'speak'];
  shuffle(St).forEach((s, i) => { if (i < types.length) rest.push(sentEx(s, types[i])); });
  return shuffle(rest);
}
function unlockedUnits() { const cu = curUnit(); return UNITS.filter(U => U.u <= cu); }
function buildPractice(m) {
  const units = unlockedUnits(), sents = units.flatMap(U => U.sents);
  if (m === 'srs') {
    let ws = dueWords(); if (ws.length < 5) ws = ws.concat(shuffle(learnedWords().filter(w => !ws.includes(w)))).slice(0, 8);
    ws = ws.slice(0, 8); if (!ws.length) return null;
    const ex = [];
    const p = pairsEx(ws); if (p) ex.push(p);
    ex.push(...wordExercises(ws, 4, ['what', 'type_tr', 'listen_pick', 'img']));
    const rel = shuffle(ALLS.filter(s => s.u <= curUnit() && wordsInSentence(s).some(en => ws.some(w => w.en === en)))).slice(0, 6);
    const types = ['tr_en', 'listen_type', 'speak', 'tr_fr', 'fill', 'listen_tiles'];
    rel.forEach((s, i) => ex.push(sentEx(s, types[i])));
    return shuffle(ex);
  }
  if (m === 'mistakes') {
    const ss = S.mistakes.map(id => SENT_BY_ID[id]).filter(Boolean).slice(-10); if (!ss.length) return null;
    return shuffle(ss.flatMap(s => [sentEx(s, rand(['tr_en', 'listen_tiles', 'fill'])), sentEx(s, rand(['tr_fr', 'speak', 'listen_type']))])).slice(0, 14);
  }
  if (m === 'listen') return !canListen() || !sents.length ? null : shuffle(sents).slice(0, 10).map((s, i) => sentEx(s, i % 2 ? 'listen_type' : 'listen_tiles'));
  if (m === 'speak') { const sm = speakMode(); return sm === 'off' || !sents.length ? null : shuffle(sents).slice(0, 8).map(s => ({ t: sm === 'mic' ? 'speak' : 'shadow', s })); }
}
function buildJump(u) {
  const ss = UNITS.slice(curUnit(), u).flatMap(U => U.sents);
  const types = ['tr_en', 'listen_tiles', 'choose_tr', 'fill', 'tr_fr', 'listen_type'];
  return shuffle(ss).slice(0, 14).map((s, i) => sentEx(s, types[i % types.length]));
}
function buildSound(id) {
  const s = SOUNDS.find(x => x.id === id), ex = [];
  for (let i = 0; i < 8; i++) { const p = s.pairs[i % s.pairs.length]; ex.push({ t: 'minimal', pair: p, ans: rand(p) }); }
  const sm = speakMode(); if (sm !== 'off') shuffle(s.ex).slice(0, 3).forEach(w => ex.push({ t: sm === 'mic' ? 'speak_word' : 'shadow', word: w }));
  return shuffle(ex);
}

function distractWords(w, n = 3) {

const RENDER = {
  img(ex) { // choisir l'image correspondant au mot français
    const w = ex.w, opts = shuffle([w, ...distractWords(w, 3)]);
    lessonShell(exHeader(`Lequel de ces dessins veut dire « ${esc(w.fr)} » ?`, ex) +
      `<div class="pics">${opts.map((o, i) => `<button class="pic" data-opt="${i}" data-act="pick" data-v="${esc(o.en)}"><span class="big emoji">${o.e}</span><span class="w">${wordLabel(o)}</span><span class="k">${i + 1}</span></button>`).join('')}</div>`, footAnswer());
    L.onPick = v => say(v);
    L.check = () => ({ ok: L.sel === w.en, ans: `${w.en} = ${w.fr}`, words: [[w.en, L.sel === w.en]] });
  },
  what(ex) { // grand dessin → mot anglais
    const w = ex.w, opts = shuffle([w, ...distractWords(w, 3)]);
    lessonShell(exHeader('Qu\'est-ce que c\'est ?', ex) + `<div class="drawing emoji">${w.e}</div>
      <div class="opts">${opts.map((o, i) => `<button class="opt" data-opt="${i}" data-act="pick" data-v="${esc(o.en)}"><span class="k">${i + 1}</span>${wordLabel(o)}</button>`).join('')}</div>`, footAnswer());
    L.onPick = v => say(v);
    L.check = () => ({ ok: L.sel === w.en, ans: `${w.en} — ${w.fr}`, words: [[w.en, L.sel === w.en]] });
  },
  listen_pick(ex) { // écouter → choisir le dessin
    const w = ex.w, opts = shuffle([w, ...distractWords(w, 3)]);
    lessonShell(exHeader('Touche ce que tu entends', ex) + spkButtons(w.en, true) +
      `<div class="pics">${opts.map((o, i) => `<button class="pic" data-opt="${i}" data-act="pick" data-v="${esc(o.en)}"><span class="big emoji">${o.e}</span><span class="w">${esc(o.fr)}</span><span class="k">${i + 1}</span></button>`).join('')}</div>`, footAnswer('Je ne peux pas écouter'));
    autoplay(w.en); L.listen = true;
    L.check = () => ({ ok: L.sel === w.en, ans: `${w.en} = ${w.fr}`, words: [[w.en, L.sel === w.en]] });
  },
  type_tr(ex) {
    const w = ex.w;
    lessonShell(exHeader(`Écris « ${esc(w.fr)} » en ${esc(COURSE.adj)}`, ex) + `<div class="drawing emoji">${w.e}</div>
      <input class="typed" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" dir="auto" placeholder="Écris en ${esc(COURSE.adj)}">`, footAnswer());
    const inp = $('#typed'); inp.focus(); inp.addEventListener('input', () => setReady(!!inp.value.trim()));
    L.check = () => {
      const ART = { en: 'the|a|an|to', es: 'el|la|los|las|un|una', it: 'il|lo|la|i|gli|le|un|una|uno', de: 'der|die|das|ein|eine|zu', pt: 'o|a|os|as|um|uma' }[COURSE.code];
      let r = accepts(inp.value, w.acc, 'en', true, w.rd);
      if (!r.ok && ART) r = accepts(inp.value.replace(new RegExp(`^\\s*(${ART})\\s+`, 'i'), '').replace(/^\s*l'/i, ''), w.acc, 'en', true, w.rd);
      if (r.ok) say(w.en);
      return { ...r, ans: w.en + (w.rd ? ` (${w.rd})` : ''), words: [[w.en, r.ok]] };
    };
  },
  pairs(ex) {
    const en = shuffle(ex.ws), fr = shuffle(ex.ws);
    lessonShell(exHeader('Associe les paires', ex) + `<div class="pairs"><div class="col">${en.map(w => `<button class="pair" data-act="pair" data-side="en" data-v="${esc(w.en)}">${wordLabel(w)}</button>`).join('')}</div>
      <div class="col">${fr.map(w => `<button class="pair" data-act="pair" data-side="fr" data-v="${esc(w.en)}">${esc(w.fr)}</button>`).join('')}</div></div>`,
      `<div class="l-foot-in"><span></span><button class="btn pri" id="checkBtn" disabled>Vérifier</button></div>`);
    L.pairSel = null; L.pairLeft = ex.ws.length; L.pairErr = false;
  },
  tr_en(ex) { tilesEx(ex, 'fr', `Écris ceci en ${esc(COURSE.adj)}`); },
  tr_fr(ex) { tilesEx(ex, 'en', 'Traduis cette phrase'); },
  listen_tiles(ex) { tilesEx(ex, 'listen', 'Tape ce que tu entends'); },
  listen_type(ex) {
    const s = ex.s;
    lessonShell(exHeader('Écris ce que tu entends', ex) + spkButtons(first(s.en), true) +
      `<textarea class="typed" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" dir="auto" placeholder="Écris en ${esc(COURSE.adj)}"></textarea>`, footAnswer('Je ne peux pas écouter'));
    autoplay(s.en); L.listen = true;
    const inp = $('#typed'); inp.focus(); inp.addEventListener('input', () => setReady(!!inp.value.trim()));
    L.check = () => ({ ...accepts(inp.value, s.en, 'en', true, s.rd), ans: disp(first(s.en)), sub: (s.rd ? s.rd + ' · ' : '') + first(s.fr) });
  },
  choose_tr(ex) {
    const s = ex.s, opts = shuffle([s, ...otherSents(s, 2)]);
    lessonShell(exHeader('Que signifie cette phrase ?', ex) + `<div class="speaker-row">${pip('talk', 90)}<div class="bubble">${spkButtons(first(s.en))}<span>${tappable(s.en, s.rd)}</span></div></div>
      <div class="opts">${opts.map((o, i) => `<button class="opt" data-opt="${i}" data-act="pick" data-v="${esc(o.id)}"><span class="k">${i + 1}</span>${esc(first(o.fr))}</button>`).join('')}</div>`, footAnswer());
    autoplay(s.en);
    L.check = () => ({ ok: L.sel === s.id, ans: first(s.fr) });
  },
  fill(ex) {
    const s = ex.s, toks = tokens(first(s.en));
    const unitW = new Set(UNITS[s.u].words.map(w => w.en.toLowerCase()));
    let idx = toks.findIndex((t, i) => i > 0 && unitW.has(t.toLowerCase()));
    if (idx < 0 || Math.random() < .3) { const cand = toks.map((t, i) => [t, i]).filter(([t, i]) => i > 0 && t.length > 2 && !NAMES.has(t)); idx = cand.length ? rand(cand)[1] : 0; }
    const answer = toks[idx];
    const pool = uniq(shuffle(UNITS[s.u].words.filter(w => !w.en.includes(' ')).map(w => w.en).concat(ALLS.filter(x => x.u === s.u).flatMap(x => tileTokens(first(x.en), 'en')))))
      .filter(t => t.toLowerCase() !== answer.toLowerCase() && !NAMES.has(t) && t.length > 1);
    const opts = shuffle([answer, ...pool.slice(0, 2)]);
    const tail = (first(s.en).match(/[.!?。！？؟]$/) || ['.'])[0];
    const sent = `<span${COURSE.rtl ? ' dir="rtl"' : ''}>` + toks.map((t, i) => i === idx ? '<span class="blank" id="blank">&nbsp;</span>' : esc(t)).join(COURSE.code === 'zh' ? '' : ' ') + tail + '</span>';
    lessonShell(exHeader('Complète la phrase', ex) + `<div class="fill-sent">${sent}</div><p class="muted" style="font-size:17px">${esc(first(s.fr))}</p>
      <div class="chips">${opts.map((o, i) => `<button class="tile" data-opt="${i}" data-act="pick" data-v="${esc(o)}">${tileLabel(o, 'en')}</button>`).join('')}</div>`, footAnswer());
    L.onPick = v => { $('#blank').textContent = v; };
    L.check = () => { const ok = (L.sel || '').toLowerCase() === answer.toLowerCase(); if (ok) say(s.en); return { ok, ans: disp(first(s.en)) + (s.rd ? ` (${s.rd})` : '') }; };
  },
  speak(ex) {
    const s = ex.s;
    lessonShell(exHeader('Lis cette phrase à voix haute', ex) +
      `<div class="speaker-row">${pip('talk', 90)}<div class="bubble">${spkButtons(first(s.en))}<span class="speak-sent">${tappable(s.en, s.rd)}</span></div></div>
      <p class="muted" style="text-align:center">${esc(first(s.fr))}</p>
      <button class="mic" id="mic" data-act="mic">🎙️ Appuie pour parler</button><div class="heard" id="heard"></div>
      <button class="btn ghost cant" data-act="cantSpeak">Je ne peux pas parler maintenant</button>`,
      `<div class="l-foot-in"><button class="btn" data-act="skip">Passer</button><button class="btn pri" id="checkBtn" disabled>Vérifier</button></div>`);
    autoplay(s.en); L.speakTarget = disp(first(s.en)); L.speakTries = 0;
  },
  speak_word(ex) {
    lessonShell(exHeader('Prononce ce mot', ex) + `<div class="drawing" style="font-size:44px;font-weight:900;width:auto">${esc(ex.word)}</div>${spkButtons(ex.word, true)}
      <button class="mic" id="mic" data-act="mic">🎙️ Appuie pour parler</button><div class="heard" id="heard"></div>
      <button class="btn ghost cant" data-act="cantSpeak">Je ne peux pas parler maintenant</button>`,
      `<div class="l-foot-in"><button class="btn" data-act="skip">Passer</button><button class="btn pri" id="checkBtn" disabled>Vérifier</button></div>`);
    autoplay(ex.word); L.speakTarget = ex.word; L.speakTries = 0;
  },
  shadow(ex) { // écoute et répète (quand le micro n'est pas accessible)
    const text = ex.s ? disp(first(ex.s.en)) : ex.word;
    lessonShell(exHeader('Écoute, puis répète à voix haute', ex) +
      (ex.s ? `<div class="speaker-row">${pip('talk', 90)}<div class="bubble"><span class="speak-sent">${tappable(ex.s.en, ex.s.rd)}</span></div></div><p class="muted" style="text-align:center">${esc(first(ex.s.fr))}</p>`
        : `<div class="drawing" style="font-size:44px;font-weight:900;width:auto">${esc(text)}</div>`) +
      spkButtons(text, true) + `<p class="muted" style="text-align:center">Imite le rythme et la mélodie de la voix. Utilise 🐢 pour décomposer, puis dis la phrase 2 ou 3 fois à voix haute.</p>
      <button class="btn ghost cant" data-act="cantSpeak">Je ne peux pas parler maintenant</button>`,
      `<div class="l-foot-in"><button class="btn" data-act="shadowNo">À retravailler</button><button class="btn pri" data-act="shadowYes">Je l'ai dit ✓</button></div>`);
    autoplay(text); L.shadowText = text;
  },
  minimal(ex) {
    const [a, b] = ex.pair;
    lessonShell(exHeader('Quel mot entends-tu ?', ex) + spkButtons(ex.ans, true) +
      `<div class="mp">${[a, b].map((w, i) => `<button class="opt" data-opt="${i}" data-act="pick" data-v="${esc(w)}">${esc(w)}</button>`).join('')}</div>`, footAnswer());
    autoplay(ex.ans); L.listen = true;
    L.check = () => ({ ok: L.sel === ex.ans, ans: `${ex.ans}` });
  }
};
/* exercices à étiquettes (mode = 'fr' : FR→EN, 'en' : EN→FR, 'listen' : audio→EN) */
function tilesEx(ex, mode, title) {
  const s = ex.s, target = mode === 'en' ? s.fr : s.en, lang = mode === 'en' ? 'fr' : 'en';
  const answerToks = tileTokens(first(target), lang);
  const ansLow = new Set(answerToks.map(t => t.toLowerCase()));
  const sameLang = ALLS.filter(x => x.id !== s.id && Math.abs(x.u - s.u) <= 2).flatMap(x => tileTokens(first(mode === 'en' ? x.fr : x.en), lang).slice(1));
  const distract = uniq(shuffle(sameLang)).filter(t => !ansLow.has(t.toLowerCase())).slice(0, clamp(Math.round(answerToks.length * .6), 2, 5));
  const bank = shuffle(answerToks.concat(distract));
  let prompt;
  if (mode === 'fr') prompt = `<div class="speaker-row">${pip('normal', 90)}<div class="bubble">${esc(first(s.fr))}</div></div>`;
  else if (mode === 'en') prompt = `<div class="speaker-row">${pip('talk', 90)}<div class="bubble">${spkButtons(first(s.en))}<span>${tappable(s.en, s.rd)}</span></div></div>`;
  else prompt = spkButtons(first(s.en), true);
  lessonShell(exHeader(title, ex) + prompt + `<div id="tilesArea"><div class="answer-line" id="ansLine"${lang === 'en' && COURSE.rtl ? ' dir="rtl"' : ''}></div><div class="bank" id="bank"${lang === 'en' && COURSE.rtl ? ' dir="rtl"' : ''}>${bank.map((t, i) => `<button class="tile" data-act="tile" data-i="${i}">${tileLabel(t, lang)}</button>`).join('')}</div></div>
    ${lang === 'en' ? `<button class="btn ghost sm kb-toggle" data-act="kbToggle">⌨️ Utiliser le clavier</button>` : ''}`, footAnswer(mode === 'listen' ? 'Je ne peux pas écouter' : 'Passer'));
  if (mode !== 'fr') autoplay(s.en);
  if (mode === 'listen') L.listen = true;
  L.bank = bank; L.picked = []; L.tileLang = lang; L.kb = false;
  L.check = () => {
    let r;
    if (L.kb) r = accepts($('#typed').value, target, lang, true, lang === 'en' ? s.rd : null);
    else r = accepts(L.picked.map(i => bank[i]).join(' '), target, lang, false);
    if (r.ok && lang === 'en') say(s.en);
    return { ...r, ans: lang === 'en' ? disp(first(target)) : first(target), sub: [lang === 'en' ? s.rd : null, mode === 'listen' ? first(s.fr) : null].filter(Boolean).join(' · ') || null };
  };
}
function renderTiles() {
  $('#ansLine').innerHTML = L.picked.map((bi, pos) => `<button class="tile" data-act="untile" data-p="${pos}">${tileLabel(L.bank[bi], L.tileLang)}</button>`).join('');
  $$('#bank .tile').forEach(b => b.classList.toggle('used', L.picked.includes(+b.dataset.i)));
  setReady(L.picked.length > 0);
}

/* --- Interactions --- */
function pick(el) {
  if (L.phase !== 'answer') return;
  $$('[data-opt]').forEach(o => o.classList.remove('sel')); el.classList.add('sel');
  L.sel = el.dataset.v; sfx.tap(); if (L.onPick) L.onPick(L.sel); setReady(true);
}
function pairClick(el) {
  const side = el.dataset.side;
  if (side === 'en') say(el.dataset.v);
  if (!L.pairSel || L.pairSel.dataset.side === side) { $$('.pair').forEach(p => p.classList.remove('sel')); el.classList.add('sel'); L.pairSel = el; return; }
  const a = L.pairSel; L.pairSel = null; $$('.pair').forEach(p => p.classList.remove('sel'));
  if (a.dataset.v === el.dataset.v) {
    a.classList.add('ok'); el.classList.add('ok'); sfx.pair(); wordResult(el.dataset.v, true);
    if (--L.pairLeft === 0) setTimeout(() => grade({ ok: true, ans: '' }), 250);
  } else {
    L.pairErr = true; sfx.bad(); wordResult(a.dataset.v, false);
    [a, el].forEach(x => { x.classList.add('no'); setTimeout(() => x.classList.remove('no'), 400); });
  }
}
let REC = null;
function micClick() {
  if (L.phase !== 'answer') return;
  if (!SR) { toast('La reconnaissance vocale nécessite Chrome ou Edge.'); return; }
  const btn = $('#mic'), heard = $('#heard');
  if (REC) { try { REC.stop(); } catch (e) { } return; }
  try { speechSynthesis.cancel(); } catch (e) { }
  const r = new SR(); REC = r;
  r.lang = srLang(); r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
  let finalAlts = null;
  btn.classList.add('rec'); btn.innerHTML = '🔴 Je t\'écoute… (touche pour arrêter)';
  r.onresult = e => {
    const res = e.results[e.results.length - 1], alts = [...res].map(a => a.transcript);
    heard.innerHTML = `<span class="muted">${esc(alts[0])}</span>`;
    if (res.isFinal) finalAlts = alts;
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') heard.innerHTML = '🚫 Micro refusé. Autorise le micro dans ton navigateur, ou touche « Je ne peux pas parler maintenant ».';
    else if (e.error === 'no-speech') heard.innerHTML = 'Je n\'ai rien entendu. Réessaie en parlant plus fort.';
    else if (e.error === 'network') heard.innerHTML = '🌐 La reconnaissance vocale de ce navigateur nécessite Internet.';
  };
  r.onend = () => {
    REC = null; if (!L) return; btn.classList.remove('rec'); btn.innerHTML = '🎙️ Appuie pour parler';
    if (!finalAlts) return;
    const sc = scoreSpeech(L.speakTarget, finalAlts);
    heard.innerHTML = sc.words.map((w, i) => `<span class="${sc.marks[i] ? 'wd-ok' : 'wd-no'}">${esc(w)}</span>`).join(' ');
    L.speakTries++;
    const pass = sc.score >= .7;
    if (pass) { S.stats.speaks++; questProgress('speak'); grade({ ok: true, ans: L.speakTarget, sub: `Score de prononciation : ${Math.round(sc.score * 100)}%` }); }
    else if (L.speakTries >= 3) grade({ ok: false, ans: L.speakTarget, sub: 'Écoute avec 🐢 puis répète lentement.' }, { noHeart: true });
    else { sfx.bad(); heard.innerHTML += `<div class="muted" style="margin-top:8px">Presque ! Les mots en rouge n'ont pas été reconnus. Réessaie (${L.speakTries}/3).</div>`; }
  };
  try { r.start(); } catch (e) { REC = null; }
}
function cantSpeak() {
  S.micOffUntil = Date.now() + 60 * 60 * 1000; save();
  toast('🎙️ Exercices oraux désactivés pendant 1 heure.');
  L.ex = L.ex.filter((e, i) => i <= L.i || !SPEAKY.has(e.t));
  L.ex.splice(L.i, 1); showEx();
}
function cantListen() {
  toast('🎧 Exercices d\'écoute retirés de cette leçon.');
  L.ex = L.ex.filter((e, i) => i < L.i || !LISTENY.has(e.t)); showEx();
}

/* --- Correction --- */
const PRAISE = ['Excellent !', 'Bravo !', 'Parfait !', 'Bien joué !', 'Super !', 'Génial !', 'Impeccable !'];
function doCheck() { if (L.phase !== 'answer' || !L.ready || !L.check) return; grade(L.check()); }
function grade(r, o = {}) {
  if (L.phase !== 'answer') return;
  L.phase = 'feedback';
  const ex = L.ex[L.i]; L.total++;
  if (r.ok) {
    L.correct++; L.combo++; L.maxCombo = Math.max(L.maxCombo, L.combo); sfx.ok();
    if (L.listen) { S.stats.listens++; questProgress('listen'); }
    if ([5, 10, 15, 20].includes(L.combo)) comboBanner(L.combo);
    if (ex.retry && ex.s) S.mistakes = S.mistakes.filter(id => id !== ex.s.id);
    if (L.kind === 'practice' && ex.s) S.mistakes = S.mistakes.filter(id => id !== ex.s.id);
  } else {
    L.combo = 0; L.mistakes++; sfx.bad();
    if (L.jumpLives != null) L.jumpLives--;
    else if (!o.noHeart && !HEARTLESS.has(L.kind)) loseHeart();
    if (ex.s && !S.mistakes.includes(ex.s.id)) S.mistakes.push(ex.s.id);
    if (L.kind !== 'jump' && !SPEAKY.has(ex.t) && (ex.retryN || 0) < 2) L.ex.push({ ...ex, retry: true, retryN: (ex.retryN || 0) + 1, isNew: false });
  }
  // répétition espacée
  if (ex.w) wordResult(ex.w.en, r.ok);
  if (ex.s) wordsInSentence(ex.s).forEach(en => wordResult(en, r.ok));
  if (r.words) r.words.forEach(([en, ok]) => { if (en !== (ex.w && ex.w.en)) wordResult(en, ok); });
  save();
  const foot = $('#lfoot');
  foot.className = 'l-foot ' + (r.ok ? 'good' : 'badf');
  const title = r.ok ? (r.typo ? 'Attention à l\'orthographe !' : rand(PRAISE)) : 'Réponse correcte :';
  const ans = r.ok ? (r.typo ? `<div class="fb-ans">${esc(r.ans)}</div>` : '') : `<div class="fb-ans">${esc(r.ans)}</div>`;
  foot.innerHTML = `<div class="l-foot-in"><div class="fb"><div class="fb-ico emoji">${r.ok ? '✅' : '❌'}</div><div><h3>${title}</h3>${ans}${r.sub ? `<div class="muted">${esc(r.sub)}</div>` : ''}</div></div>
    <button class="btn ${r.ok ? 'ok' : 'bad'}" id="contBtn" data-act="continue">Continuer</button></div>`;
  $$('.l-body button, .l-body input, .l-body textarea').forEach(b => { if (!b.classList.contains('spk') && !b.classList.contains('tw')) b.disabled = true; });
  $('.l-top .l-hearts').textContent = L.jumpLives != null ? `🛡️ ${L.jumpLives}` : HEARTLESS.has(L.kind) || unlimited() ? '❤️ ∞' : `❤️ ${S.hearts}`;
  if (!r.ok && first(r.ans) && /[a-z]/i.test(r.ans) && (L.tileLang === 'en' || ex.t === 'listen_type' || ex.t === 'speak' || ex.t === 'fill')) setTimeout(() => say(r.ans), 300);
  setTimeout(() => $('#contBtn') && $('#contBtn').focus(), 50);
}
function comboBanner(n) {
  const b = document.createElement('div'); b.className = 'combo-banner'; b.textContent = `🔥 ${n} bonnes réponses d'affilée !`;
  document.body.appendChild(b); setTimeout(() => b.remove(), 1600);
}
function continueLesson() {
  if (L.phase !== 'feedback') return;
  if (L.jumpLives != null && L.jumpLives < 0) return endScreen(false);
  if (!unlimited() && !HEARTLESS.has(L.kind) && L.jumpLives == null && S.hearts <= 0) return outOfHeartsMid();
  L.i++; L.listen = false; L.onPick = null; showEx();
}
function outOfHeartsMid() {
  $('#overlay').innerHTML = `<div class="end">${pip('sad', 150)}<h1 style="color:var(--bad)">Plus de cœurs</h1><p class="muted">Recharge tes cœurs pour terminer la leçon, ou reviens plus tard (1 cœur toutes les 30 min).</p>
    <div class="goal-opts" style="width:min(360px,90vw)"><button class="btn pri" data-act="refillMid">Recharger — 350 💎 (tu as ${S.gems})</button><button class="btn" data-act="exitLesson">Quitter la leçon</button></div></div>`;
}
function finishLesson() { endScreen(L.jumpLives == null || L.jumpLives >= 0); }
function endScreen(passed) {
  const secs = Math.round((Date.now() - L.start) / 1000);
  S.stats.seconds += secs; S.stats.total += L.total; S.stats.correct += L.correct;
  S.stats.maxCombo = Math.max(S.stats.maxCombo, L.maxCombo); questProgress('combo', L.maxCombo);
  if (!passed) {
    save(); sfx.bad();
    $('#overlay').innerHTML = `<div class="end">${pip('sad', 150)}<h1 style="color:var(--bad)">Pas encore !</h1><p class="muted">Tu as fait plus de 3 erreurs. Continue le parcours normalement, tu y arriveras.</p><button class="btn pri" style="min-width:240px" data-act="exitLesson">Continuer</button></div>`;
    return;
  }
  const acc = L.total ? Math.round(L.correct / L.total * 100) : 100;
  const perfect = L.mistakes === 0;
  let base = { lesson: 10, review: 15, trophy: 20, practice: 10, jump: 20, sound: 10 }[L.kind] || 10;
  base += perfect ? 5 : 0; base += Math.min(5, Math.floor(L.maxCombo / 5));
  const xp = addXP(base);
  S.stats.lessons++; if (perfect) { S.stats.perfect++; questProgress('perfect'); } questProgress('lessons');

let ST = null;
function startStory(id) {

}
function storyShell(foot) {
  const pct = ST.i / ST.s.lines.length * 100;
  $('#overlay').innerHTML = `<div class="l-top"><button class="x" data-act="exitLesson" aria-label="Quitter">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="emoji" style="font-size:24px">${ST.s.e}</span></div>
    <div class="l-body" id="stBody"><h2 style="text-align:center"><span class="emoji">${ST.s.e}</span> ${esc(ST.s.title)}</h2><p class="muted" style="text-align:center">Touche une bulle pour voir la traduction · 🔊 pour réécouter</p>${ST.html}</div>
    <div class="l-foot" id="lfoot">${foot}</div>`;
  const b = $('#stBody'); const ls = $$('.st-line', b); if (ls.length && ST.phase !== 'q') ls[ls.length - 1].classList.add('new'); b.scrollTop = b.scrollHeight;
}
function lineHTML(who, en, fr) {
  const c = CHARACTERS[who] || { e: '🙂' };
  return `<div class="st-line"><div class="st-av emoji">${c.e}<small>${esc(who)}</small></div><div class="st-b" data-act="toggleFr">${spkButtons(en).replace('class="spk"', 'class="spk" style="width:32px;height:32px;font-size:15px;margin-right:8px;float:left"').replace(`data-t="${esc(en)}"`, `data-t="${esc(en)}" data-who="${esc(who)}"`)}${tappable(en)}<div class="fr">${esc(fr)}</div></div></div>`;
}
function storyStep() {
  const s = ST.s;
  if (ST.i >= s.lines.length) return storyEnd();
  const item = s.lines[ST.i];
  if (item.l) {
    const [who, en, fr] = item.l;
    ST.html += lineHTML(who, en, fr); ST.phase = 'next';
    storyShell(`<div class="l-foot-in"><span></span><button class="btn pri" id="contBtn" data-act="storyNext">Continuer</button></div>`);
    say(en, false, (CHARACTERS[who] || {}).pitch || 1);
    ST.phase = 'next';
  } else if (item.q === 'choice') {
    ST.phase = 'q'; ST.sel = null;
    storyShell(`<div class="l-foot-in"><span></span><button class="btn pri" id="checkBtn" data-act="storyCheck" disabled>Vérifier</button></div>`);
    $('#stBody').insertAdjacentHTML('beforeend', `<div class="st-q"><h3>❓ ${esc(item.p)}</h3><div class="opts">${item.o.map((o, i) => `<button class="opt" data-opt="${i}" data-act="storyPick" data-v="${i}"><span class="k">${i + 1}</span>${esc(o)}</button>`).join('')}</div></div>`);
    $('#stBody').scrollTop = 1e6;
  } else if (item.q === 'speak') {
    ST.phase = 'q';
    if (speakMode() === 'shadow') {
      storyShell(`<div class="l-foot-in"><button class="btn" data-act="storySkipSpeak">Passer</button><button class="btn pri" data-act="storyShadowOk">Je l'ai dit ✓</button></div>`);
      $('#stBody').insertAdjacentHTML('beforeend', `<div class="st-q"><h3>🗣️ À toi ! Tu es ${esc(item.who)}, dis à voix haute :</h3><div class="speak-sent" style="margin:8px 0">${spkButtons(item.en)} ${tappable(item.en)}</div><p class="muted">${esc(item.fr)}</p></div>`);
      $('#stBody').scrollTop = 1e6; say(item.en); return;
    }
    if (!canSpeak()) { ST.html += lineHTML(item.who, item.en, item.fr); storyShell(`<div class="l-foot-in"><span></span><button class="btn pri" id="contBtn" data-act="storyNext">Continuer</button></div>`); say(item.en); ST.phase = 'next'; return; }
    storyShell(`<div class="l-foot-in"><button class="btn" data-act="storySkipSpeak">Passer</button><span></span></div>`);
    $('#stBody').insertAdjacentHTML('beforeend', `<div class="st-q"><h3>🎙️ À toi ! Tu es ${esc(item.who)}, dis :</h3><div class="speak-sent" style="margin:8px 0">${spkButtons(item.en)} ${tappable(item.en)}</div><p class="muted">${esc(item.fr)}</p>
      <button class="mic" id="mic" data-act="storyMic">🎙️ Appuie pour parler</button><div class="heard" id="heard"></div></div>`);
    $('#stBody').scrollTop = 1e6; ST.tries = 0;

}
function storyAfterQ(ok, extraHTML) {
  const item = ST.s.lines[ST.i];
  if (ok) sfx.ok(); else { sfx.bad(); ST.mistakes++; }
  if (item.q === 'speak') ST.html += lineHTML(item.who, item.en, item.fr);
  else ST.html += `<div class="st-q" style="border-color:${ok ? 'var(--ok)' : 'var(--bad)'};background:${ok ? 'var(--ok-bg)' : 'var(--bad-bg)'}"><b>${esc(item.p)}</b><br>${ok ? '' : `❌ <s>${esc(item.o[ST.sel])}</s> → `}✅ ${esc(item.o[item.a])}</div>`;
  storyShell(`<div class="l-foot-in"><div class="fb"><div class="fb-ico emoji">${ok ? '✅' : '❌'}</div><h3>${ok ? rand(PRAISE) : 'Bonne réponse : ' + esc(item.q === 'choice' ? item.o[item.a] : item.en)}</h3></div><button class="btn ${ok ? 'ok' : 'bad'}" id="contBtn" data-act="storyNext">Continuer</button></div>`);

  ST.phase = 'next';
}
function storyMic() {
  if (REC) { try { REC.stop(); } catch (e) { } return; }
  const item = ST.s.lines[ST.i], btn = $('#mic'), heard = $('#heard');
  try { speechSynthesis.cancel(); } catch (e) { }
  const r = new SR(); REC = r; r.lang = S.settings.accent; r.interimResults = true; r.maxAlternatives = 5;
  let fin = null; btn.classList.add('rec'); btn.innerHTML = '🔴 Je t\'écoute…';
  r.onresult = e => { const res = e.results[e.results.length - 1], alts = [...res].map(a => a.transcript); heard.textContent = alts[0]; if (res.isFinal) fin = alts; };
  r.onerror = e => { if (e.error === 'not-allowed') heard.textContent = '🚫 Micro refusé.'; };
  r.onend = () => {
    REC = null; if (!ST) return; btn.classList.remove('rec'); btn.innerHTML = '🎙️ Appuie pour parler'; if (!fin) return;
    const sc = scoreSpeech(item.en, fin); ST.tries++;
    heard.innerHTML = sc.words.map((w, i) => `<span class="${sc.marks[i] ? 'wd-ok' : 'wd-no'}">${esc(w)}</span>`).join(' ');
    if (sc.score >= .7) { S.stats.speaks++; questProgress('speak'); storyAfterQ(true); }
    else if (ST.tries >= 3) storyAfterQ(false);
    else heard.innerHTML += `<div class="muted">Réessaie (${ST.tries}/3)</div>`;
  };
  try { r.start(); } catch (e) { REC = null; }
}
function storyEnd() {
  const isFirst = !S.stories[ST.s.id];
  S.stories[ST.s.id] = true; S.stats.stories++; questProgress('story');

    const ex = L.ex[L.i];
    if (L.listen && (LISTENY.has(ex.t) || ex.t === 'listen_pick')) return cantListen();
    const ans = ex.s ? (ex.t === 'tr_fr' || ex.t === 'choose_tr' ? first(ex.s.fr) : disp(first(ex.s.en))) : ex.w ? `${ex.w.en} = ${ex.w.fr}` : ex.ans || ex.word || '';
    grade({ ok: false, ans }, { noHeart: SPEAKY.has(ex.t) });
  },
  continue: () => continueLesson(),
  mic: () => micClick(),
  cantSpeak: () => cantSpeak(),
  shadowYes: () => { if (!L || L.phase !== 'answer') return; S.stats.speaks++; questProgress('speak'); grade({ ok: true, ans: L.shadowText, sub: 'Continue à imiter les voix natives !' }); },
  shadowNo: () => { if (!L || L.phase !== 'answer') return; grade({ ok: false, ans: L.shadowText, sub: 'Réécoute avec 🐢 et répète lentement.' }, { noHeart: true }); },
  storyShadowOk: () => { if (!ST || ST.phase !== 'q') return; S.stats.speaks++; questProgress('speak'); storyAfterQ(true); },
  refillMid: () => { if (buy(350)) { S.hearts = MAXH; save(); L.i++; showEx(); } },
  // histoires
  toggleFr: el => el.classList.toggle('showfr'),
  storyNext: () => { if (!ST || ST.phase !== 'next') return; ST.i++; storyStep(); },
  storyPick: el => { if (ST.phase !== 'q') return; $$('[data-act=storyPick]').forEach(o => o.classList.remove('sel')); el.classList.add('sel'); ST.sel = +el.dataset.v; $('#checkBtn').disabled = false; },
  storyCheck: () => { if (ST.phase !== 'q' || ST.sel == null) return; storyAfterQ(ST.sel === ST.s.lines[ST.i].a); },
  storyMic: () => storyMic(),
  storySkipSpeak: () => { if (REC) { try { REC.abort(); } catch (e) { } REC = null; } storyAfterQ(false); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('.pop')) $$('.pop').forEach(p => p.remove()); return; }
  if (el.disabled) return;
  if (el.dataset.act !== 'node' && !el.closest('.pop')) $$('.pop').forEach(p => p.remove());
  const f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'import-file' && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { try { const d = JSON.parse(fr.result); if (!d || typeof d !== 'object' || !('xp' in d)) throw 0; localStorage.setItem(KEY, JSON.stringify(d)); S = load(); loadCourse(S.course || 'en'); render(); toast('✅ Progression importée'); } catch (err) { toast('❌ Fichier invalide'); } };
    fr.readAsText(el.files[0]); return;
  }
  if (el.id === 'set-name') { S.name = el.value.trim(); save(); render(); return; }
  const k = el.dataset.set; if (!k) return;
  if (k === 'goal') S.goal = +el.value; else if (k === 'rate') S.settings.rate = +el.value; else S.settings[k] = el.value;
  save(); render();
});
document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('on')) { if (e.key === 'Escape') closeModal(); return; }
  if (ST && $('#overlay').classList.contains('on')) {
    if (e.key === 'Enter') { e.preventDefault(); if (ST.phase === 'next') ACT.storyNext(); else if (ST.sel != null) ACT.storyCheck(); }
    else if (/^[1-9]$/.test(e.key) && ST.phase === 'q') { const o = $$('[data-act=storyPick]')[+e.key - 1]; if (o) ACT.storyPick(o); }
    return;
  }
  if (!L || !$('#overlay').classList.contains('on')) return;
  if (e.key === 'Enter') { e.preventDefault(); if (L.phase === 'feedback') continueLesson(); else doCheck(); return; }
  const typing = /input|textarea/i.test(document.activeElement.tagName);
  if (!typing && /^[1-9]$/.test(e.key) && L.phase === 'answer') { const o = $$('.l-body [data-opt]')[+e.key - 1]; if (o) pick(o); }
});
setInterval(() => { if (!L && !ST && !$('#modal').classList.contains('on') && VIEW !== 'profile') { const before = S.hearts; syncHearts(); if (S.hearts !== before) { save(); render(); } } }, 60000);

/* ---------- Démarrage ---------- */
loadCourse(S.course || 'en');
checkStreak(); settleLeague(); ensureQuests(); render();
if (!S.onboarded) onboarding();
initCloud();
</script>
</body>
